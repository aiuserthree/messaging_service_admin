<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 정책 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('security-policy'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('보안 정책'));
            </script>
            
            <div class="admin-content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('ip')">IP 접근 제어</button>
                    <button class="tab" onclick="switchTab('password')">비밀번호 정책</button>
                </div>
                
                <div id="tab-ip" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">IP 접근 제어</h3>
                            <div class="card-description">관리자 페이지 접근 허용 IP 등록 및 관리</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">IP 주소 추가</label>
                            <div style="display: flex; gap: 12px; align-items: center;">
                                <input type="text" class="form-control" placeholder="예: 192.168.1.100" id="ip-address" style="max-width: 200px;">
                                <select class="form-control" id="ip-type" style="width: 130px;">
                                    <option value="whitelist">화이트리스트</option>
                                    <option value="blacklist">블랙리스트</option>
                                </select>
                                <button class="btn btn-primary" onclick="addIP()">추가</button>
                            </div>
                        </div>
                        <div class="table-container" style="margin-top: 24px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>IP 주소</th>
                                        <th>유형</th>
                                        <th>등록일</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>192.168.1.100</td>
                                        <td><span class="badge badge-success">화이트리스트</span></td>
                                        <td>2024-11-19</td>
                                        <td>
                                            <button class="btn btn-danger btn-sm" onclick="removeIP(1)">삭제</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div id="tab-password" class="tab-content" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">비밀번호 정책</h3>
                            <div class="card-description">비밀번호 복잡도, 변경 주기, 재사용 제한 등 설정</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">최소 비밀번호 길이</label>
                            <input type="number" class="form-control" value="8" min="4" max="20">
                        </div>
                        <div class="form-group">
                            <label class="form-label">비밀번호 변경 주기 (일)</label>
                            <input type="number" class="form-control" value="90" min="30">
                        </div>
                        <div class="form-group">
                            <label class="form-label">재사용 제한 (개)</label>
                            <input type="number" class="form-control" value="5" min="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">필수 포함 문자</label>
                            <div>
                                <input type="checkbox" checked> 대문자
                                <input type="checkbox" checked> 소문자
                                <input type="checkbox" checked> 숫자
                                <input type="checkbox" checked> 특수문자
                            </div>
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="savePasswordPolicy()">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(`tab-${tabName}`).style.display = 'block';
            event.target.classList.add('active');
        }
        
        function addIP() {
            const ip = document.getElementById('ip-address').value;
            if (!ip) {
                showToast('IP 주소를 입력해주세요.', 'error');
                return;
            }
            showToast('IP가 추가되었습니다.', 'success');
        }
        
        function removeIP(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                showToast('삭제되었습니다.', 'success');
            }
        }
        
        function savePasswordPolicy() {
            showToast('저장되었습니다.', 'success');
        }
    </script>
    <style>
        .tab-content {
            margin-top: 24px;
        }
    </style>
</body>
</html>
