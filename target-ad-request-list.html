        function fmtDate(d) {
            const days = ['일','월','화','수','목','금','토'];
            const dt = new Date(d + 'T00:00:00');
            return `${d.slice(5).replace('-', '/')}(${days[dt.getDay()]})`;
        }

        function renderRows(rows) {
            const body = document.getElementById('requestTableBody');
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="9" class="text-center ta-muted" style="padding:40px;">조건에 맞는 신청이 없습니다.</td></tr>';
            } else {
                body.innerHTML = rows.map(r => `
                    <tr class="${r.over ? 'row-over' : ''}" style="cursor:pointer;" onclick="location.href='target-ad-request-detail.html?no=${r.no}'">
                        <td><a href="target-ad-request-detail.html?no=${r.no}" class="ta-mono" style="color:var(--admin-primary);font-weight:600;text-decoration:none;">${r.no}</a></td>
                        <td>${r.company}</td>
                        <td class="wrap">${r.campaign}${r.q ? `<a href="target-ad-request-detail.html?no=${r.no}#secTimeline" class="ta-q ${r.q.need ? 'need' : ''}" title="미답변 고객 질문 · ${r.q.note}">질문 ${r.q.n}</a>` : ''}</td>
                        <td class="wrap">${r.media.map(m => `<span class="ta-media">${MEDIA[m]}</span>`).join('')}</td>
                        <td>${fmtDate(r.send)}</td>
                        <td><span class="ta-status ${STATUS[r.status].cls}">${STATUS[r.status].name}</span></td>
                        <td><span class="ta-due ${r.over ? 'over' : r.soon ? 'soon' : ''}">${r.due}</span></td>
                        <td class="text-center"><span class="ta-count ${r.pending ? '' : 'zero'}">${r.pending}</span></td>
                        <td class="ta-muted">${r.received}</td>
                    </tr>`).join('');
            }
            document.getElementById('resultCount').textContent = `${rows.length}건 / 전체 ${REQUESTS.length}건`;
        }

        function applyFilter() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const st = document.getElementById('statusFilter').value;
            const md = document.getElementById('mediaFilter').value;
            const ind = document.getElementById('industryFilter').value;
            const basis = document.getElementById('dateBasis').value;
            const from = document.getElementById('startDate').value;
            const to = document.getElementById('endDate').value;
            const over = document.getElementById('overdueOnly').checked;
            const qOnly = document.getElementById('questionOnly').checked;
            const rows = REQUESTS.filter(r => {
                if (q && !(r.no.toLowerCase().includes(q) || r.company.toLowerCase().includes(q) || r.campaign.toLowerCase().includes(q))) return false;
                if (st && r.status !== st) return false;
                if (md && !r.media.includes(md)) return false;
                if (ind && r.industry !== ind) return false;
                const d = basis === 'send' ? r.send : r.received.slice(0, 10);
                if (from && d < from) return false;
                if (to && d > to) return false;
                if (over && !r.over) return false;
                if (qOnly && !r.q) return false;
                return true;
            });
            renderRows(rows);
        }

        function resetFilter() {
            ['searchInput','statusFilter','mediaFilter','industryFilter'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('dateBasis').value = 'received';
            document.getElementById('startDate').value = '2026-10-14';
            document.getElementById('endDate').value = '2026-11-13';
            document.getElementById('overdueOnly').checked = false;
            document.getElementById('questionOnly').checked = false;
            applyFilter();
        }

        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });
        ['statusFilter','mediaFilter','industryFilter','dateBasis','startDate','endDate','overdueOnly','questionOnly'].forEach(id =>
            document.getElementById(id).addEventListener('change', applyFilter));
        document.getElementById('statCardOver').style.cursor = 'pointer';
        document.getElementById('statCardOver').addEventListener('click', () => {
            document.getElementById('overdueOnly').checked = true; applyFilter();
        });
        document.getElementById('statCardQuestion').style.cursor = 'pointer';
        document.getElementById('statCardQuestion').addEventListener('click', () => {
            document.getElementById('questionOnly').checked = true; applyFilter();
        });

        renderRows(REQUESTS);
        createPagination(1, 1, 'pagination');
    </script>
