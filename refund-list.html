<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환불 신청 내역 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
    <style>
        .refund-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .refund-toolbar .form-label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .refund-toolbar .form-control {
            min-width: 160px;
            max-width: 200px;
        }
        .refund-toolbar .btn-primary {
            min-width: 100px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px 16px;
            align-items: baseline;
        }
        .detail-label { color: #64748b; font-size: 13px; }
        .detail-value { font-size: 14px; color: #1e293b; }
        .detail-link {
            color: #2563eb;
            text-decoration: none;
        }
        .detail-link:hover { text-decoration: underline; }
        .refund-table-wrap th,
        .refund-table-wrap td { padding: 8px 10px; font-size: 13px; text-align: center; }
        .refund-status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .refund-status-badge.processing { background: #fef3c7; color: #92400e; }
        .refund-status-badge.completed { background: #dcfce7; color: #166534; }
        .refund-status-badge.rejected { background: #fee2e2; color: #991b1b; }
        .modal-footer .btn + .btn { margin-left: 8px; }
        .reject-reason-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
        .reject-reason-wrap label { display: block; margin-bottom: 6px; font-size: 13px; color: #475569; }
        .reject-reason-wrap textarea { width: 100%; min-height: 80px; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 13px; resize: vertical; }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('refund-list'));
        </script>

        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('환불 신청 내역'));
            </script>

            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">환불 신청 내역</h3>
                        <div class="card-description">환불 신청 시 수집된 데이터를 회원명(업체명) 검색으로 조회할 수 있습니다.</div>
                    </div>

                    <div class="refund-toolbar">
                        <label class="form-label">검색</label>
                        <input type="text" class="form-control" id="search-company" placeholder="회원명 또는 업체명으로 검색">
                        <button type="button" class="btn btn-primary" onclick="searchRefunds()">조회</button>
                    </div>

                    <div class="table-container refund-table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>신청일시</th>
                                    <th>회원명(업체명)</th>
                                    <th>환불대상(P)</th>
                                    <th>환불수수료(P)</th>
                                    <th>실제환불금액(P)</th>
                                    <th>상태</th>
                                    <th>처리일</th>
                                    <th>반려사유</th>
                                    <th>환불 사유</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="refund-list-tbody">
                            </tbody>
                        </table>
                    </div>
                    <div id="empty-state" class="empty-state" style="display: none;">
                        환불 신청 내역이 없습니다.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 상세보기 모달 -->
    <div id="refund-detail-modal" class="modal">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h3 class="modal-title">환불 신청 상세</h3>
                <button class="modal-close" onclick="closeRefundDetailModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <div class="detail-grid" id="detail-content">
                    <!-- 동적 생성 -->
                </div>
                <div id="reject-reason-wrap" class="reject-reason-wrap" style="display: none;">
                    <label for="reject-reason-input">반려 사유 <span style="color: #ef4444;">*</span></label>
                    <textarea id="reject-reason-input" placeholder="반려 사유를 입력하세요"></textarea>
                    <div style="margin-top: 10px; display: flex; gap: 8px;">
                        <button type="button" class="btn btn-primary" onclick="confirmReject()">확인</button>
                        <button type="button" class="btn btn-outline" onclick="document.getElementById('reject-reason-wrap').style.display='none'; document.getElementById('reject-reason-input').value=''">취소</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span id="detail-action-buttons"></span>
                <button type="button" class="btn btn-outline" onclick="closeRefundDetailModal()">닫기</button>
            </div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script>
        // 상태: processing(처리중), completed(환불완료), rejected(반려)
        const refundApplications = [
            {
                id: 1,
                requestDate: '2024-11-19 10:30:00',
                companyName: '홍길동',
                refundTarget: 1000000,
                refundFee: 100000,
                actualAmount: 900000,
                bankName: 'KB국민은행',
                accountNumber: '12345678901234',
                accountHolder: '홍길동',
                bankbookFile: '통장사본_홍길동.pdf',
                reason: '서비스 미사용',
                status: 'processing',
                processedDate: null,
                remark: null
            },
            {
                id: 2,
                requestDate: '2024-11-18 14:20:00',
                companyName: '(주)테스트기업',
                refundTarget: 320000,
                refundFee: 32000,
                actualAmount: 288000,
                bankName: '신한은행',
                accountNumber: '110123456789',
                accountHolder: '(주)테스트기업',
                bankbookFile: '통장사본_테스트기업.jpg',
                reason: '사업 종료',
                status: 'completed',
                processedDate: '2024-11-22',
                remark: null
            },
            {
                id: 3,
                requestDate: '2024-11-17 09:15:00',
                companyName: '김철수',
                refundTarget: 50000,
                refundFee: 0,
                actualAmount: 50000,
                bankName: '카카오뱅크',
                accountNumber: '3333123456789',
                accountHolder: '김철수',
                bankbookFile: '통장사본_김철수.pdf',
                reason: '단순 변심',
                status: 'processing',
                processedDate: null,
                remark: null
            },
            {
                id: 4,
                requestDate: '2024-11-16 16:45:00',
                companyName: '박영희',
                refundTarget: 8000,
                refundFee: 800,
                actualAmount: 7200,
                bankName: '토스뱅크',
                accountNumber: '100012345678',
                accountHolder: '박영희',
                bankbookFile: '통장사본_박영희.png',
                reason: '서비스 불만족',
                status: 'rejected',
                processedDate: '2024-11-02',
                remark: '계좌정보 불일치'
            },
            {
                id: 5,
                requestDate: '2024-11-15 11:00:00',
                companyName: '테크솔루션',
                refundTarget: 150000,
                refundFee: 15000,
                actualAmount: 135000,
                bankName: 'IBK기업은행',
                accountNumber: '456789012345',
                accountHolder: '테크솔루션',
                bankbookFile: '통장사본_테크솔루션.pdf',
                reason: '타 서비스 전환',
                status: 'processing',
                processedDate: null,
                remark: null
            },
            {
                id: 6,
                requestDate: '2024-11-14 13:30:00',
                companyName: '이민수',
                refundTarget: 75000,
                refundFee: 7500,
                actualAmount: 67500,
                bankName: 'NH농협은행',
                accountNumber: '78901234567890',
                accountHolder: '이민수',
                bankbookFile: '통장사본_이민수.jpg',
                reason: '개인 사정',
                status: 'processing',
                processedDate: null,
                remark: null
            }
        ];

        let filteredList = [];

        function formatPoint(n) {
            return (n || 0).toLocaleString() + ' P';
        }

        function searchRefunds() {
            const keyword = (document.getElementById('search-company').value || '').trim().toLowerCase();
            if (!keyword) {
                filteredList = refundApplications.slice();
            } else {
                filteredList = refundApplications.filter(function(r) {
                    return (r.companyName || '').toLowerCase().indexOf(keyword) !== -1;
                });
            }
            renderTable();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTable() {
            const tbody = document.getElementById('refund-list-tbody');
            const emptyEl = document.getElementById('empty-state');

            if (filteredList.length === 0) {
                tbody.innerHTML = '';
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            var statusLabel = { processing: '처리중', completed: '환불완료', rejected: '반려' };
            var statusClass = { processing: 'processing', completed: 'completed', rejected: 'rejected' };
            tbody.innerHTML = filteredList.map(r => {
                var st = r.status || 'processing';
                var badge = '<span class="refund-status-badge ' + statusClass[st] + '">' + statusLabel[st] + '</span>';
                return '<tr>' +
                    '<td>' + escapeHtml(r.requestDate) + '</td>' +
                    '<td>' + escapeHtml(r.companyName) + '</td>' +
                    '<td>' + formatPoint(r.refundTarget) + '</td>' +
                    '<td>' + (r.refundFee ? '-' + formatPoint(r.refundFee) : '0 P') + '</td>' +
                    '<td>' + formatPoint(r.actualAmount) + '</td>' +
                    '<td>' + badge + '</td>' +
                    '<td>' + escapeHtml(r.processedDate || '-') + '</td>' +
                    '<td>' + (r.status === 'rejected' ? escapeHtml(r.remark || '') : '') + '</td>' +
                    '<td>' + escapeHtml(r.reason || '-') + '</td>' +
                    '<td><button type="button" class="btn btn-outline btn-sm" onclick="openRefundDetail(' + r.id + ')">상세보기</button></td>' +
                '</tr>';
            }).join('');
        }

        function getStatusLabel(status) {
            return { processing: '처리중', completed: '환불완료', rejected: '반려' }[status] || '처리중';
        }

        var currentRefundDetailId = null;

        function openRefundDetail(id) {
            var r = refundApplications.find(function(x) { return x.id === id; });
            if (!r) return;
            currentRefundDetailId = id;
            var grid = document.getElementById('detail-content');
            var bankbookHtml = r.bankbookFile
                ? '<a href="#" class="detail-link" data-id="' + r.id + '" onclick="downloadBankbook(event)">' + escapeHtml(r.bankbookFile) + '</a> <span style="color:#64748b;font-size:12px;">(다운로드)</span>'
                : '-';
            var st = r.status || 'processing';
            var statusLabel = getStatusLabel(st);
            var statusClass = { processing: 'processing', completed: 'completed', rejected: 'rejected' }[st];
            grid.innerHTML =
                '<span class="detail-label">신청일시</span><span class="detail-value">' + escapeHtml(r.requestDate) + '</span>' +
                '<span class="detail-label">회원명(업체명)</span><span class="detail-value">' + escapeHtml(r.companyName) + '</span>' +
                '<span class="detail-label">상태</span><span class="detail-value"><span class="refund-status-badge ' + statusClass + '">' + statusLabel + '</span></span>' +
                '<span class="detail-label">처리일</span><span class="detail-value">' + escapeHtml(r.processedDate || '-') + '</span>' +
                (r.status === 'rejected' ? ('<span class="detail-label">반려사유</span><span class="detail-value">' + escapeHtml(r.remark || '') + '</span>') : '') +
                '<span class="detail-label">환불대상(P)</span><span class="detail-value">' + formatPoint(r.refundTarget) + '</span>' +
                '<span class="detail-label">환불수수료(P)</span><span class="detail-value">' + (r.refundFee ? '-' + formatPoint(r.refundFee) : '0 P') + '</span>' +
                '<span class="detail-label">실제환불금액(P)</span><span class="detail-value">' + formatPoint(r.actualAmount) + '</span>' +
                '<span class="detail-label">은행</span><span class="detail-value">' + escapeHtml(r.bankName || '-') + '</span>' +
                '<span class="detail-label">계좌번호</span><span class="detail-value">' + escapeHtml(r.accountNumber || '-') + '</span>' +
                '<span class="detail-label">예금주</span><span class="detail-value">' + escapeHtml(r.accountHolder || '-') + '</span>' +
                '<span class="detail-label">통장사본</span><span class="detail-value">' + bankbookHtml + '</span>' +
                '<span class="detail-label">환불 사유</span><span class="detail-value">' + escapeHtml(r.reason || '-') + '</span>';

            var reasonWrap = document.getElementById('reject-reason-wrap');
            var reasonInput = document.getElementById('reject-reason-input');
            reasonWrap.style.display = 'none';
            if (reasonInput) reasonInput.value = '';

            var actionEl = document.getElementById('detail-action-buttons');
            if (st === 'processing') {
                actionEl.innerHTML = '<button type="button" class="btn btn-primary" onclick="confirmRefundComplete()">환불완료</button>' +
                    '<button type="button" class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;" onclick="showRejectReason()">반려</button>';
            } else {
                actionEl.innerHTML = '';
            }
            openModal('refund-detail-modal');
        }

        function showRejectReason() {
            document.getElementById('reject-reason-wrap').style.display = 'block';
            document.getElementById('reject-reason-input').focus();
        }

        function confirmRefundComplete() {
            var r = refundApplications.find(function(x) { return x.id === currentRefundDetailId; });
            if (!r) return;
            if (!confirm('이 건을 환불완료 처리하시겠습니까?')) return;
            r.status = 'completed';
            r.processedDate = new Date().toISOString().slice(0, 10).replace(/-/g, '-');
            r.remark = r.remark || null;
            closeRefundDetailModal();
            renderTable();
            if (typeof showToast === 'function') showToast('환불완료 처리되었습니다.', 'success');
        }

        function confirmReject() {
            var reason = (document.getElementById('reject-reason-input').value || '').trim();
            if (!reason) {
                if (typeof showToast === 'function') showToast('반려 사유를 입력해주세요.', 'error');
                return;
            }
            var r = refundApplications.find(function(x) { return x.id === currentRefundDetailId; });
            if (!r) return;
            r.status = 'rejected';
            r.processedDate = new Date().toISOString().slice(0, 10).replace(/-/g, '-');
            r.remark = reason;
            document.getElementById('reject-reason-wrap').style.display = 'none';
            document.getElementById('reject-reason-input').value = '';
            closeRefundDetailModal();
            renderTable();
            if (typeof showToast === 'function') showToast('반려 처리되었습니다.', 'success');
        }

        function closeRefundDetailModal() {
            currentRefundDetailId = null;
            document.getElementById('reject-reason-wrap').style.display = 'none';
            document.getElementById('reject-reason-input').value = '';
            closeModal('refund-detail-modal');
        }

        function downloadBankbook(event, filename) {
            event.preventDefault();
            var id = event.target.getAttribute('data-id');
            if (id) {
                var r = refundApplications.find(function(x) { return x.id === Number(id); });
                filename = r && r.bankbookFile ? r.bankbookFile : null;
            }
            if (!filename) return;
            var blob = new Blob(['통장사본 파일 (실제 연동 시 서버 URL에서 다운로드)'], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            if (typeof showToast === 'function') showToast('통장사본을 다운로드했습니다.', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            filteredList = refundApplications.slice();
            renderTable();
            document.getElementById('search-company').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchRefunds();
            });
        });
    </script>
</body>
</html>
