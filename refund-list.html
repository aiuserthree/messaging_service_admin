<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환불 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('refund-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('환불 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">환불 요청 목록</h3>
                        <div class="card-description">탈퇴 회원의 환불 요청 목록 조회 및 환불 승인</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>요청일시</th>
                                    <th>회원명</th>
                                    <th>환불 요청 금액</th>
                                    <th>환불 사유</th>
                                    <th>처리 상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>2024-11-19 10:30:00</td>
                                    <td>홍길동</td>
                                    <td>₩50,000</td>
                                    <td>서비스 미사용</td>
                                    <td><span class="badge badge-warning">처리 대기</span></td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="processRefund(1)">처리</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function processRefund(id) {
            if (confirm('환불을 승인하시겠습니까?')) {
                showToast('환불이 처리되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
