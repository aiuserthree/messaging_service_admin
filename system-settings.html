<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경 설정 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('system-settings'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('환경 설정'));
            </script>
            
            <div class="admin-content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('policy')">서비스 정책 설정</button>
                    <button class="tab" onclick="switchTab('notification')">알림 설정</button>
                </div>
                
                <div id="tab-policy" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">서비스 정책 설정</h3>
                            <div class="card-description">발송 제한 정책, 요금 정책, 가입 정책 등 시스템 전반의 운영 정책 관리</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원 유형별 일일 발송 제한</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                                <div>
                                    <label class="form-label">개인 회원</label>
                                    <input type="number" class="form-control" value="10000" min="0">
                                </div>
                                <div>
                                    <label class="form-label">사업자 회원</label>
                                    <input type="number" class="form-control" value="50000" min="0">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원 등급별 일일 발송 제한</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                                <div>
                                    <label class="form-label">일반 등급</label>
                                    <input type="number" class="form-control" value="10000" min="0">
                                </div>
                                <div>
                                    <label class="form-label">VIP 등급</label>
                                    <input type="number" class="form-control" value="100000" min="0">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">시간 단위 발송 한도</label>
                            <input type="number" class="form-control" value="1000" min="0">
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">특정 시간대(정시 또는 30분 단위)에 발송 가능한 최대 처리량</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">발송 금지 시간 (야간 발송 금지)</label>
                            <div style="display: flex; gap: 12px; align-items: center;">
                                <input type="time" class="form-control" value="21:00" style="width: 150px;">
                                <span>~</span>
                                <input type="time" class="form-control" value="08:00" style="width: 150px;">
                            </div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">광고 메시지 발송 금지 시간 (정보성 메시지는 제외)</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">대량 발송 사전 승인 기준</label>
                            <input type="number" class="form-control" value="50000" min="0">
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">건 이상 발송 시 사전 승인 필요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">요금 정책</label>
                            <textarea class="form-control" rows="4" placeholder="요금 정책을 입력하세요"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">가입 정책</label>
                            <textarea class="form-control" rows="4" placeholder="가입 정책을 입력하세요"></textarea>
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="savePolicy()">저장</button>
                        </div>
                    </div>
                </div>
                
                <div id="tab-notification" class="tab-content" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">알림 설정</h3>
                            <div class="card-description">관리자 알림 수신 조건 및 방법 설정</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">이메일 알림</label>
                            <input type="checkbox" checked> 활성화
                        </div>
                        <div class="form-group">
                            <label class="form-label">SMS 알림</label>
                            <input type="checkbox"> 활성화
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="saveNotification()">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(`tab-${tabName}`).style.display = 'block';
            event.target.classList.add('active');
        }
        
        function savePolicy() {
            showToast('저장되었습니다.', 'success');
        }
        
        function saveNotification() {
            showToast('저장되었습니다.', 'success');
        }
    </script>
    <style>
        .tab-content {
            margin-top: 24px;
        }
    </style>
</body>
</html>
