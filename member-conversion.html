<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 전환 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('member-conversion'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('회원 전환 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">개인→사업자 회원 전환 신청</h3>
                        <div class="card-description">개인 회원의 사업자 회원 전환 신청 목록 조회 및 승인 처리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>신청일시</th>
                                    <th>회원명</th>
                                    <th>이메일</th>
                                    <th>사업자등록번호</th>
                                    <th>서류 상태</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>2024-11-19 10:30:00</td>
                                    <td>홍길동</td>
                                    <td>hong@example.com</td>
                                    <td>123-45-67890</td>
                                    <td><span class="badge badge-success">제출 완료</span></td>
                                    <td><span class="badge badge-warning">검토 대기</span></td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="reviewConversion(1)">검토</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 전환 승인/반려 모달 -->
    <div id="conversion-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">회원 전환 처리</h3>
                <button class="modal-close" onclick="closeModal('conversion-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">처리 선택</label>
                <select class="form-control" id="conversion-action">
                    <option value="approve">승인</option>
                    <option value="reject">반려</option>
                    <option value="request-supplement">보완 요청</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">사유</label>
                <textarea class="form-control" id="conversion-reason" rows="4" placeholder="처리 사유를 입력하세요"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">주의사항</label>
                <div style="padding: 12px; background-color: #fef3c7; border-radius: 8px; font-size: 14px;">
                    사업자 회원으로 전환 시 기존 개인 회원의 발신번호는 발송이 불가하며, 기업 명의의 발신번호를 등록한 후 발송이 가능합니다.
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('conversion-modal')">취소</button>
                <button class="btn btn-primary" onclick="processConversion()">처리</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function reviewConversion(id) {
            openModal('conversion-modal');
        }
        
        function processConversion() {
            const action = document.getElementById('conversion-action').value;
            const reason = document.getElementById('conversion-reason').value;
            
            if (!reason) {
                showToast('사유를 입력해주세요.', 'error');
                return;
            }
            
            showToast('처리가 완료되었습니다.', 'success');
            closeModal('conversion-modal');
        }
    </script>
</body>
</html>
