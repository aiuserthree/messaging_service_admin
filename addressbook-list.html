<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소록 목록 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('addressbook-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('주소록 목록'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">그룹명</label>
                            <input type="text" class="form-control" placeholder="그룹명" id="search-group">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">등록 기간</label>
                            <input type="date" class="form-control" id="date-from">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">~</label>
                            <input type="date" class="form-control" id="date-to">
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchAddressbook()">조회</button>
                            <button class="btn btn-outline" onclick="exportExcel()">엑셀 다운로드</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">전체 주소록 조회</h3>
                        <div class="card-description">회원별 등록된 모든 고객 주소록 (전화번호 마스킹 처리)</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>회원명</th>
                                    <th>주소록명</th>
                                    <th>그룹명</th>
                                    <th>수신자 수</th>
                                    <th>등록일</th>
                                    <th>최종 수정일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="addressbook-list-tbody">
                                <tr>
                                    <td>홍길동</td>
                                    <td>고객 주소록 1</td>
                                    <td>VIP 고객</td>
                                    <td>1,000</td>
                                    <td>2024-01-15</td>
                                    <td>2024-11-19</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="viewDetail(1)">상세보기</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 주소록 상세 모달 -->
    <div id="addressbook-detail-modal" class="modal">
        <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 class="modal-title">주소록 상세/편집</h3>
                <button class="modal-close" onclick="closeModal('addressbook-detail-modal')">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">주소록 정보</h3>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">주소록명</label>
                            <input type="text" class="form-control" value="고객 주소록 1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원명</label>
                            <div class="form-control" style="background-color: #f1f5f9;">홍길동</div>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">수신자 목록</h3>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>이름</th>
                                    <th>전화번호</th>
                                    <th>그룹</th>
                                    <th>등록일</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>김철수</td>
                                    <td>010-****-5678</td>
                                    <td>VIP 고객</td>
                                    <td>2024-01-15</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('addressbook-detail-modal')">닫기</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function searchAddressbook() {
            showToast('검색 완료', 'success');
        }
        
        function viewDetail(id) {
            // 모달에 주소록 정보 로드
            openModal('addressbook-detail-modal');
        }
        
        function exportExcel() {
            showToast('엑셀 다운로드 기능은 준비 중입니다.', 'info');
        }
    </script>
</body>
</html>
