<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 등급 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('member-grade'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('회원 등급 관리'));
            </script>
            
            <div class="admin-content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('grade-list')">등급 목록</button>
                    <button class="tab" onclick="switchTab('grade-policy')">등급 정책 설정</button>
                </div>
                
                <div id="tab-grade-list" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">회원 등급 목록</h3>
                            <div class="card-description">회원 등급별 회원 목록 조회 및 등급 변경</div>
                        </div>
                        <div class="search-filter-bar">
                            <div class="filter-item">
                                <label class="form-label">등급</label>
                                <select class="form-control" id="filter-grade">
                                    <option value="">전체</option>
                                    <option value="normal">일반</option>
                                    <option value="vip">VIP</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label class="form-label">회원 유형</label>
                                <select class="form-control" id="filter-type">
                                    <option value="">전체</option>
                                    <option value="individual">개인</option>
                                    <option value="business">기업</option>
                                </select>
                            </div>
                            <div class="filter-item" style="align-self: flex-end;">
                                <button class="btn btn-primary" onclick="searchMembers()">조회</button>
                            </div>
                        </div>
                        <div class="table-container" style="margin-top: 24px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>회원명</th>
                                        <th>이메일</th>
                                        <th>회원 유형</th>
                                        <th>현재 등급</th>
                                        <th>최근 3개월 평균 결제금액</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>홍길동</td>
                                        <td>hong@example.com</td>
                                        <td>개인</td>
                                        <td><span class="badge badge-info">일반</span></td>
                                        <td>₩500,000</td>
                                        <td>
                                            <button class="btn btn-primary btn-sm" onclick="changeGrade('M001', 'normal')">등급 변경</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>김철수</td>
                                        <td>kim@example.com</td>
                                        <td>기업</td>
                                        <td><span class="badge badge-warning">VIP</span></td>
                                        <td>₩5,000,000</td>
                                        <td>
                                            <button class="btn btn-primary btn-sm" onclick="changeGrade('M002', 'vip')">등급 변경</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div id="tab-grade-policy" class="tab-content" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">등급 정책 설정</h3>
                            <div class="card-description">회원 등급 산정 기준 및 혜택 설정</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">일반 등급</label>
                            <div class="form-control" style="background-color: #f1f5f9; padding: 16px;">
                                <div>등급 산정 기준: 톡벨 서비스를 이용하는 모든 회원에게 일반 등급을 부여</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">VIP 등급 산정 기준</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                                <div>
                                    <label class="form-label">개인 회원 기준</label>
                                    <input type="text" class="form-control" value="최근 3개월 간 월 평균 결제 금액이 상위 10%">
                                </div>
                                <div>
                                    <label class="form-label">사업자 회원 기준</label>
                                    <input type="text" class="form-control" value="최근 3개월 간 월 평균 결제 금액이 상위 10%">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">VIP 혜택</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                                <div>
                                    <label class="form-label">마일리지 지급률</label>
                                    <input type="number" class="form-control" value="10" min="0" max="100">
                                    <div style="font-size: 12px; color: #64748b; margin-top: 4px;">포인트 충전 시 충전 포인트의 %만큼 마일리지 추가 증정</div>
                                </div>
                                <div>
                                    <label class="form-label">일일 발송 한도</label>
                                    <input type="number" class="form-control" value="100000" min="0">
                                    <div style="font-size: 12px; color: #64748b; margin-top: 4px;">일반 등급 대비 증가량</div>
                                </div>
                            </div>
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="saveGradePolicy()">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(`tab-${tabName}`).style.display = 'block';
            event.target.classList.add('active');
        }
        
        function searchMembers() {
            showToast('조회 완료', 'success');
        }
        
        function changeGrade(memberId, currentGrade) {
            const newGrade = currentGrade === 'normal' ? 'VIP' : '일반';
            if (confirm(`회원 등급을 ${newGrade}로 변경하시겠습니까?`)) {
                showToast('회원 등급이 변경되었습니다.', 'success');
            }
        }
        
        function saveGradePolicy() {
            showToast('등급 정책이 저장되었습니다.', 'success');
        }
    </script>
    <style>
        .tab-content {
            margin-top: 24px;
        }
    </style>
</body>
</html>
