<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('faq-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('FAQ 관리'));
            </script>
            
            <div class="admin-content">
                <div style="margin-bottom: 24px;">
                    <button class="btn btn-primary" onclick="location.href='faq-edit.html'">FAQ 등록</button>
                </div>
                
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">검색</label>
                            <input type="text" class="form-control" placeholder="제목, 내용으로 검색" id="search-faq">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">카테고리</label>
                            <select class="form-control" id="filter-category">
                                <option value="">전체</option>
                                <option value="usage">사용법</option>
                                <option value="billing">결제</option>
                                <option value="technical">기술</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchFAQ()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">FAQ 목록</h3>
                        <div class="card-description">자주 묻는 질문 목록 조회 및 관리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>순서</th>
                                    <th>카테고리</th>
                                    <th>제목</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>사용법</td>
                                    <td>메시지 발송 방법은?</td>
                                    <td>2024-11-19</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="editFAQ(1)">수정</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteFAQ(1)">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function searchFAQ() {
            showToast('검색 완료', 'success');
        }
        
        function editFAQ(id) {
            location.href = `faq-edit.html?id=${id}`;
        }
        
        function deleteFAQ(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                showToast('삭제되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
