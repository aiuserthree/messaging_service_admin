<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오톡 발신 프로필 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('sender-profile'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('카카오톡 발신 프로필 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">카카오톡 발신 프로필 목록</h3>
                        <div class="card-description">회원이 등록한 카카오톡 발신 프로필 목록 조회 및 관리</div>
                    </div>
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">프로필 유형</label>
                            <select class="form-control" id="filter-type">
                                <option value="">전체</option>
                                <option value="alimtalk">알림톡</option>
                                <option value="brandtalk">브랜드 메시지</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchProfiles()">조회</button>
                        </div>
                    </div>
                    <div class="table-container" style="margin-top: 24px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>회원명</th>
                                    <th>프로필명</th>
                                    <th>프로필 ID</th>
                                    <th>유형</th>
                                    <th>비즈니스 인증</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="profile-list-tbody">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 40px;">
                                        조회 버튼을 클릭하여 프로필 목록을 검색하세요.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 발신 프로필 상세 모달 -->
    <div id="profile-detail-modal" class="modal">
        <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 class="modal-title">카카오톡 발신 프로필 상세</h3>
                <button class="modal-close" onclick="closeModal('profile-detail-modal')">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">기본 정보</h3>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">회원명</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-name">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">프로필명</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-profile-name">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">프로필 ID</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-profile-id">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">유형</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-profile-type">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">비즈니스 인증</label>
                            <div id="modal-business-auth">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">등록일</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-register-date">-</div>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">카카오톡 채널 정보</h3>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">채널명</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-channel-name">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">채널 상태</label>
                            <div id="modal-channel-status">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">카테고리</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-category">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">템플릿 개수</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-template-count">-</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('profile-detail-modal')">닫기</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockProfiles = [
            {
                id: 1,
                memberName: '홍길동',
                memberEmail: 'hong@example.com',
                profileName: '톡벨 서비스',
                profileId: '@talkbell',
                type: 'alimtalk',
                typeLabel: '알림톡',
                businessAuth: true,
                registerDate: '2024-01-20',
                channelName: '톡벨 서비스',
                channelStatus: 'active',
                category: '서비스',
                templateCount: 15
            },
            {
                id: 2,
                memberName: '김철수',
                memberEmail: 'kim@example.com',
                profileName: '김철수 카페',
                profileId: '@kimcafe',
                type: 'brandtalk',
                typeLabel: '브랜드 메시지',
                businessAuth: true,
                registerDate: '2024-02-15',
                channelName: '김철수 카페',
                channelStatus: 'active',
                category: '음식점',
                templateCount: 8
            },
            {
                id: 3,
                memberName: '이영희',
                memberEmail: 'lee@example.com',
                profileName: '이영희 쇼핑몰',
                profileId: '@leeshop',
                type: 'alimtalk',
                typeLabel: '알림톡',
                businessAuth: false,
                registerDate: '2024-03-10',
                channelName: '이영희 쇼핑몰',
                channelStatus: 'pending',
                category: '쇼핑몰',
                templateCount: 3
            }
        ];
        
        function searchProfiles() {
            const searchMember = document.getElementById('search-member').value.trim();
            const filterType = document.getElementById('filter-type').value;
            
            // 필터링
            let filteredProfiles = mockProfiles.filter(profile => {
                // 회원명 검색
                if (searchMember && !profile.memberName.includes(searchMember)) {
                    return false;
                }
                // 프로필 유형 필터
                if (filterType && profile.type !== filterType) {
                    return false;
                }
                return true;
            });
            
            // 테이블 업데이트
            const tbody = document.getElementById('profile-list-tbody');
            
            if (filteredProfiles.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            검색 결과가 없습니다.
                        </td>
                    </tr>
                `;
                showToast('검색 결과가 없습니다.', 'info');
            } else {
                tbody.innerHTML = filteredProfiles.map(profile => {
                    const businessAuthBadge = profile.businessAuth 
                        ? '<span class="badge badge-success">인증 완료</span>'
                        : '<span class="badge badge-warning">인증 대기</span>';
                    
                    return `
                        <tr>
                            <td>${profile.memberName}</td>
                            <td>${profile.profileName}</td>
                            <td>${profile.profileId}</td>
                            <td>${profile.typeLabel}</td>
                            <td>${businessAuthBadge}</td>
                            <td>${profile.registerDate}</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="viewProfileDetail(${profile.id})">상세보기</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                showToast(`${filteredProfiles.length}건의 프로필이 조회되었습니다.`, 'success');
            }
        }
        
        function viewProfileDetail(id) {
            const profile = mockProfiles.find(p => p.id === id);
            if (profile) {
                document.getElementById('modal-member-name').textContent = profile.memberName;
                document.getElementById('modal-profile-name').textContent = profile.profileName;
                document.getElementById('modal-profile-id').textContent = profile.profileId;
                document.getElementById('modal-profile-type').textContent = profile.typeLabel;
                document.getElementById('modal-business-auth').innerHTML = profile.businessAuth 
                    ? '<span class="badge badge-success">인증 완료</span>'
                    : '<span class="badge badge-warning">인증 대기</span>';
                document.getElementById('modal-register-date').textContent = profile.registerDate;
                document.getElementById('modal-channel-name').textContent = profile.channelName;
                document.getElementById('modal-channel-status').innerHTML = profile.channelStatus === 'active'
                    ? '<span class="badge badge-success">활성</span>'
                    : '<span class="badge badge-warning">대기</span>';
                document.getElementById('modal-category').textContent = profile.category;
                document.getElementById('modal-template-count').textContent = `${profile.templateCount}개`;
                
                openModal('profile-detail-modal');
            }
        }
        
        // Enter 키로 검색
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-member');
            if (searchInput) {
                searchInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        searchProfiles();
                    }
                });
            }
        });
    </script>
</body>
</html>
