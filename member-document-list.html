<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서류 목록 조회 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('member-document-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('서류 목록 조회'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">서류 유형</label>
                            <select class="form-control" id="filter-type">
                                <option value="">전체</option>
                                <option value="business">사업자등록증</option>
                                <option value="id">신분증</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">승인 상태</label>
                            <select class="form-control" id="filter-status">
                                <option value="">전체</option>
                                <option value="pending">승인 대기</option>
                                <option value="approved">승인</option>
                                <option value="rejected">반려</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchDocuments()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">서류 목록</h3>
                        <div class="card-description">회원이 제출한 사업자등록증, 신분증 등 각종 서류 목록 (암호화 저장)</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>회원명</th>
                                    <th>서류 유형</th>
                                    <th>제출일</th>
                                    <th>승인 상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="document-list-tbody">
                                <tr>
                                    <td colspan="5" style="text-align: center; padding: 40px;">
                                        조회 버튼을 클릭하여 서류 목록을 검색하세요.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockDocuments = [
            {
                id: 1,
                memberName: '홍길동',
                memberEmail: 'hong@example.com',
                documentType: 'business',
                documentTypeLabel: '사업자등록증',
                submitDate: '2024-01-15',
                status: 'approved',
                statusLabel: '승인'
            },
            {
                id: 2,
                memberName: '김철수',
                memberEmail: 'kim@example.com',
                documentType: 'id',
                documentTypeLabel: '신분증',
                submitDate: '2024-01-20',
                status: 'pending',
                statusLabel: '승인 대기'
            },
            {
                id: 3,
                memberName: '이영희',
                memberEmail: 'lee@example.com',
                documentType: 'business',
                documentTypeLabel: '사업자등록증',
                submitDate: '2024-02-10',
                status: 'rejected',
                statusLabel: '반려'
            },
            {
                id: 4,
                memberName: '박지훈',
                memberEmail: 'park@example.com',
                documentType: 'id',
                documentTypeLabel: '신분증',
                submitDate: '2024-02-15',
                status: 'approved',
                statusLabel: '승인'
            },
            {
                id: 5,
                memberName: '최민수',
                memberEmail: 'choi@example.com',
                documentType: 'other',
                documentTypeLabel: '기타',
                submitDate: '2024-03-01',
                status: 'pending',
                statusLabel: '승인 대기'
            }
        ];
        
        function searchDocuments() {
            const searchMember = document.getElementById('search-member').value.trim();
            const filterType = document.getElementById('filter-type').value;
            const filterStatus = document.getElementById('filter-status').value;
            
            // 필터링
            let filteredDocuments = mockDocuments.filter(doc => {
                // 회원명 검색
                if (searchMember && !doc.memberName.includes(searchMember)) {
                    return false;
                }
                // 서류 유형 필터
                if (filterType && doc.documentType !== filterType) {
                    return false;
                }
                // 승인 상태 필터
                if (filterStatus && doc.status !== filterStatus) {
                    return false;
                }
                return true;
            });
            
            // 테이블 업데이트
            const tbody = document.getElementById('document-list-tbody');
            
            if (filteredDocuments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">
                            검색 결과가 없습니다.
                        </td>
                    </tr>
                `;
                showToast('검색 결과가 없습니다.', 'info');
            } else {
                tbody.innerHTML = filteredDocuments.map(doc => {
                    const statusBadge = {
                        'approved': 'badge-success',
                        'pending': 'badge-warning',
                        'rejected': 'badge-danger'
                    }[doc.status] || 'badge-secondary';
                    
                    return `
                        <tr>
                            <td>${doc.memberName}</td>
                            <td>${doc.documentTypeLabel}</td>
                            <td>${doc.submitDate}</td>
                            <td><span class="badge ${statusBadge}">${doc.statusLabel}</span></td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="downloadDocument(${doc.id})">다운로드</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                showToast(`${filteredDocuments.length}건의 서류가 조회되었습니다.`, 'success');
            }
        }
        
        function downloadDocument(id) {
            const document = mockDocuments.find(d => d.id === id);
            if (document) {
                // 실제로는 API 호출하여 파일 다운로드
                showToast(`${document.memberName}님의 ${document.documentTypeLabel} 다운로드를 시작합니다.`, 'info');
                
                // Mock 다운로드 시뮬레이션
                const link = document.createElement('a');
                link.href = '#'; // 실제로는 파일 URL
                link.download = `${document.memberName}_${document.documentTypeLabel}_${document.submitDate}.pdf`;
                link.click();
                
                showToast('다운로드가 완료되었습니다. (접근 로그가 기록됩니다.)', 'success');
            } else {
                showToast('서류 정보를 찾을 수 없습니다.', 'error');
            }
        }
        
        // Enter 키로 검색
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-member');
            if (searchInput) {
                searchInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        searchDocuments();
                    }
                });
            }
        });
    </script>
</body>
</html>
