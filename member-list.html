<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 목록 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('member-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('회원 목록'));
            </script>
            
            <div class="admin-content">
                <!-- 검색 및 필터 -->
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원 검색</label>
                            <input type="text" class="form-control" placeholder="이름, 이메일로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">회원유형</label>
                            <select class="form-control" id="filter-type">
                                <option value="">전체</option>
                                <option value="individual">개인</option>
                                <option value="business">기업</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">상태</label>
                            <select class="form-control" id="filter-status">
                                <option value="">전체</option>
                                <option value="active">활성</option>
                                <option value="inactive">비활성</option>
                                <option value="dormant">휴면</option>
                                <option value="withdrawn">탈퇴</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">가입일</label>
                            <input type="date" class="form-control" id="date-from">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">~</label>
                            <input type="date" class="form-control" id="date-to">
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchMembers()">조회</button>
                            <button class="btn btn-outline" onclick="exportExcel()">엑셀 다운로드</button>
                        </div>
                    </div>
                </div>
                
                <!-- 회원 목록 -->
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">회원 목록</h3>
                        <div class="card-description">전체 회원(개인/기업) 목록 조회</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>회원 ID</th>
                                    <th>이름</th>
                                    <th>이메일</th>
                                    <th>회원유형</th>
                                    <th>회원 등급</th>
                                    <th>가입일</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="member-list-tbody">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 40px;">
                                        데이터를 불러오는 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 회원 상세 모달 -->
    <div id="member-detail-modal" class="modal">
        <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 class="modal-title">회원 상세 정보</h3>
                <button class="modal-close" onclick="closeModal('member-detail-modal')">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div class="tabs">
                    <button class="tab active" onclick="switchModalTab('basic')">기본정보</button>
                    <button class="tab" onclick="switchModalTab('sender')">발신번호</button>
                    <button class="tab" onclick="switchModalTab('payment')">결제내역</button>
                    <button class="tab" onclick="switchModalTab('send-history')">발송이력</button>
                </div>
                
                <div id="modal-tab-basic" class="tab-content" style="margin-top: 24px;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">기본 정보</h3>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                            <div class="form-group">
                                <label class="form-label">회원 ID</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-id">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">이름</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-name">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">이메일</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-email">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">회원유형</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-type">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">회원 등급</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-grade">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">가입일</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-join-date">-</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">상태</label>
                                <div class="form-control" style="background-color: #f1f5f9;" id="modal-member-status">-</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="modal-tab-sender" class="tab-content" style="display: none; margin-top: 24px;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">발신번호 등록 현황</h3>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>발신번호</th>
                                        <th>인증 상태</th>
                                        <th>등록일</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>010-1234-5678</td>
                                        <td><span class="badge badge-success">승인</span></td>
                                        <td>2024-01-20</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div id="modal-tab-payment" class="tab-content" style="display: none; margin-top: 24px;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">결제 내역</h3>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>결제일시</th>
                                        <th>금액</th>
                                        <th>결제수단</th>
                                        <th>상태</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>2024-11-19 10:30:00</td>
                                        <td>₩100,000</td>
                                        <td>신용카드</td>
                                        <td><span class="badge badge-success">완료</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div id="modal-tab-send-history" class="tab-content" style="display: none; margin-top: 24px;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">발송 이력</h3>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>발송일시</th>
                                        <th>메시지 유형</th>
                                        <th>발송 건수</th>
                                        <th>성공</th>
                                        <th>실패</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>2024-11-19 14:30:00</td>
                                        <td><span class="badge badge-info">알림톡</span></td>
                                        <td>1,000</td>
                                        <td>995</td>
                                        <td>5</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('member-detail-modal')">닫기</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        let currentPage = 1;
        let mockData = [];
        
        function searchMembers(page = 1) {
            currentPage = page;
            
            const search = document.getElementById('search-member').value;
            const type = document.getElementById('filter-type').value;
            const status = document.getElementById('filter-status').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;
            
            // 실제로는 API 호출
            mockData = [
                {
                    id: 'M001',
                    name: '홍길동',
                    email: 'hong@example.com',
                    type: 'individual',
                    grade: 'normal',
                    joinDate: '2024-01-15',
                    status: 'active'
                },
                {
                    id: 'M002',
                    name: '김철수',
                    email: 'kim@example.com',
                    type: 'business',
                    grade: 'vip',
                    joinDate: '2024-02-20',
                    status: 'active'
                },
                {
                    id: 'M003',
                    name: '이영희',
                    email: 'lee@example.com',
                    type: 'individual',
                    grade: 'normal',
                    joinDate: '2024-03-10',
                    status: 'inactive'
                }
            ];
            
            const tbody = document.getElementById('member-list-tbody');
            tbody.innerHTML = mockData.map(member => `
                <tr>
                    <td>${member.id}</td>
                    <td>${member.name}</td>
                    <td>${member.email}</td>
                    <td>${member.type === 'individual' ? '개인' : '기업'}</td>
                    <td><span class="badge ${member.grade === 'vip' ? 'badge-warning' : 'badge-info'}">${member.grade === 'vip' ? 'VIP' : '일반'}</span></td>
                    <td>${member.joinDate}</td>
                    <td><span class="badge ${getStatusBadge(member.status)}">${getStatusLabel(member.status)}</span></td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="viewDetail('${member.id}')">상세보기</button>
                    </td>
                </tr>
            `).join('');
            
            createPagination(currentPage, 10, 'pagination');
        }
        
        function getStatusLabel(status) {
            const labels = {
                'active': '활성',
                'inactive': '비활성',
                'dormant': '휴면',
                'withdrawn': '탈퇴'
            };
            return labels[status] || status;
        }
        
        function getStatusBadge(status) {
            const badges = {
                'active': 'badge-success',
                'inactive': 'badge-warning',
                'dormant': 'badge-secondary',
                'withdrawn': 'badge-danger'
            };
            return badges[status] || 'badge-secondary';
        }
        
        function viewDetail(id) {
            // 모달에 회원 정보 로드
            const member = mockData.find(m => m.id === id);
            if (member) {
                document.getElementById('modal-member-id').textContent = member.id;
                document.getElementById('modal-member-name').textContent = member.name;
                document.getElementById('modal-member-email').textContent = member.email;
                document.getElementById('modal-member-type').textContent = member.type === 'individual' ? '개인' : '기업';
                document.getElementById('modal-member-grade').innerHTML = `<span class="badge ${member.grade === 'vip' ? 'badge-warning' : 'badge-info'}">${member.grade === 'vip' ? 'VIP' : '일반'}</span>`;
                document.getElementById('modal-member-join-date').textContent = member.joinDate;
                document.getElementById('modal-member-status').innerHTML = `<span class="badge ${getStatusBadge(member.status)}">${getStatusLabel(member.status)}</span>`;
                
                openModal('member-detail-modal');
            }
        }
        
        function exportExcel() {
            showToast('엑셀 다운로드 기능은 준비 중입니다.', 'info');
        }
        
        function switchModalTab(tabName) {
            document.querySelectorAll('#member-detail-modal .tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('#member-detail-modal .tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(`modal-tab-${tabName}`).style.display = 'block';
            event.target.classList.add('active');
        }
        
        // 페이지 로드 시 초기 데이터 로드
        document.addEventListener('DOMContentLoaded', function() {
            searchMembers();
        });
    </script>
</body>
</html>
