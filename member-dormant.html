<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴면 회원 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('member-dormant'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('휴면 회원 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">휴면 회원 정책 설정</h3>
                        <div class="card-description">휴면 회원 전환 기준 및 사전 안내 정책 설정</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">휴면 전환 기준</label>
                        <input type="number" class="form-control" value="365" min="1">
                        <div style="font-size: 12px; color: #64748b; margin-top: 4px;">최종 로그인 일자로부터 일 이상 서비스를 이용하지 않은 경우 휴면 회원으로 전환</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">사전 안내 일정</label>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                            <div>
                                <label class="form-label">1차 안내</label>
                                <input type="number" class="form-control" value="30" min="1">
                                <div style="font-size: 12px; color: #64748b; margin-top: 4px;">휴면 전환 예정일 N일 전</div>
                            </div>
                            <div>
                                <label class="form-label">2차 안내</label>
                                <input type="number" class="form-control" value="7" min="1">
                                <div style="font-size: 12px; color: #64748b; margin-top: 4px;">휴면 전환 예정일 N일 전</div>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 16px;">
                        <button class="btn btn-primary" onclick="saveDormantPolicy()">저장</button>
                        <button class="btn btn-outline" onclick="executeDormantConversion()">휴면 전환 실행</button>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">휴면 회원 목록</h3>
                        <div class="card-description">휴면 상태인 회원 목록 조회 및 해제</div>
                    </div>
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">최종 로그인 기간</label>
                            <input type="date" class="form-control" id="date-from">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">~</label>
                            <input type="date" class="form-control" id="date-to">
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchDormantMembers()">조회</button>
                        </div>
                    </div>
                    <div class="table-container" style="margin-top: 24px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>회원명</th>
                                    <th>이메일</th>
                                    <th>최종 로그인</th>
                                    <th>휴면 전환일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>이영희</td>
                                    <td>lee@example.com</td>
                                    <td>2023-11-19</td>
                                    <td>2024-11-19</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="releaseDormant('M003')">휴면 해제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function saveDormantPolicy() {
            showToast('휴면 회원 정책이 저장되었습니다.', 'success');
        }
        
        function executeDormantConversion() {
            if (confirm('휴면 전환 기준에 해당하는 회원을 휴면 상태로 전환하시겠습니까?')) {
                showToast('휴면 전환이 실행되었습니다.', 'success');
            }
        }
        
        function searchDormantMembers() {
            showToast('조회 완료', 'success');
        }
        
        function releaseDormant(memberId) {
            if (confirm('휴면 상태를 해제하시겠습니까? 회원은 본인 재인증을 통해 해제할 수 있습니다.')) {
                showToast('휴면 상태가 해제되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
