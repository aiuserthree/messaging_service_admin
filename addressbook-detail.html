<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소록 상세/편집 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('addressbook-detail'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('주소록 상세/편집'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">주소록 정보</h3>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">주소록명</label>
                            <input type="text" class="form-control" value="고객 주소록 1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원명</label>
                            <div class="form-control" style="background-color: #f1f5f9;">홍길동</div>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">수신자 목록</h3>
                        <div class="card-description">수신자 등록, 수정, 삭제 및 그룹 이동</div>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <button class="btn btn-primary" onclick="addRecipient()">수신자 추가</button>
                        <button class="btn btn-outline" onclick="bulkEdit()">일괄 편집</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th><input type="checkbox"></th>
                                    <th>이름</th>
                                    <th>전화번호</th>
                                    <th>그룹</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="checkbox"></td>
                                    <td>김철수</td>
                                    <td>010-****-5678</td>
                                    <td>VIP 고객</td>
                                    <td>2024-01-15</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="editRecipient(1)">수정</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteRecipient(1)">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function addRecipient() {
            showToast('수신자 추가 기능은 준비 중입니다.', 'info');
        }
        
        function editRecipient(id) {
            showToast('수신자 수정 기능은 준비 중입니다.', 'info');
        }
        
        function deleteRecipient(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                showToast('삭제되었습니다.', 'success');
            }
        }
        
        function bulkEdit() {
            showToast('일괄 편집 기능은 준비 중입니다.', 'info');
        }
    </script>
</body>
</html>
