<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 접근 로그 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('access-log-member'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('회원 접근 로그'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">기간</label>
                            <input type="date" class="form-control" id="date-from">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">~</label>
                            <input type="date" class="form-control" id="date-to">
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchLogs()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">회원 접근 이력</h3>
                        <div class="card-description">회원의 로그인 이력 및 이상 접근 패턴 모니터링</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>접속일시</th>
                                    <th>회원명</th>
                                    <th>접속 IP</th>
                                    <th>위치</th>
                                    <th>이상 패턴</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>2024-11-19 14:30:00</td>
                                    <td>홍길동</td>
                                    <td>192.168.1.100</td>
                                    <td>서울, 대한민국</td>
                                    <td>-</td>
                                </tr>
                                <tr style="background-color: #fee2e2;">
                                    <td>2024-11-19 13:00:00</td>
                                    <td>김철수</td>
                                    <td>203.0.113.1</td>
                                    <td>해외</td>
                                    <td><span class="badge badge-danger">해외 IP</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function searchLogs() {
            showToast('조회 완료', 'success');
        }
    </script>
</body>
</html>
