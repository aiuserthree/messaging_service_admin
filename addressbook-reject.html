<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수신거부 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('addressbook-reject'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('수신거부 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">전화번호 검색</label>
                            <input type="text" class="form-control" placeholder="전화번호로 검색" id="search-phone">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">수신 거부한 발신번호</label>
                            <input type="text" class="form-control" placeholder="발신번호" id="search-sender">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">거부 일시</label>
                            <input type="date" class="form-control" id="date-from">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">~</label>
                            <input type="date" class="form-control" id="date-to">
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchReject()">조회</button>
                            <button class="btn btn-outline" onclick="exportExcel()">엑셀 다운로드</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">수신거부 목록</h3>
                        <div class="card-description">전체 주소록의 수신거부 등록된 전화번호 목록 조회</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>전화번호</th>
                                    <th>수신 거부한 발신번호</th>
                                    <th>거부 일시</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>010-****-5678</td>
                                    <td>010-1234-5678</td>
                                    <td>2024-11-19 14:30:00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function searchReject() {
            showToast('검색 완료', 'success');
        }
        
        function exportExcel() {
            showToast('엑셀 다운로드 기능은 준비 중입니다.', 'info');
        }
    </script>
</body>
</html>
