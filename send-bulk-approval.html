<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대량 발송 승인 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('send-bulk-approval'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('대량 발송 승인'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">대량 발송 승인 요청</h3>
                        <div class="card-description">nn,nnn건 이상의 대량 발송 건에 대한 사전 승인 처리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>요청일시</th>
                                    <th>회원명</th>
                                    <th>발송 예정일시</th>
                                    <th>발송 건수</th>
                                    <th>메시지 유형</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>2024-11-19 10:00:00</td>
                                    <td>홍길동</td>
                                    <td>2024-11-21 10:00:00</td>
                                    <td>100,000건</td>
                                    <td><span class="badge badge-info">알림톡</span></td>
                                    <td><span class="badge badge-warning">승인 대기</span></td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="reviewBulkSend(1)">검토</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 승인/반려 모달 -->
    <div id="bulk-approval-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">대량 발송 승인 처리</h3>
                <button class="modal-close" onclick="closeModal('bulk-approval-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">발송 정보</label>
                <div style="padding: 12px; background-color: #f1f5f9; border-radius: 8px;">
                    <div>회원: 홍길동</div>
                    <div>발송 예정일시: 2024-11-21 10:00:00</div>
                    <div>발송 건수: 100,000건</div>
                    <div>메시지 유형: 알림톡</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">시스템 부하 검토</label>
                <div style="padding: 12px; background-color: #fef3c7; border-radius: 8px; font-size: 14px;">
                    해당 시간대 예상 발송량과 시스템 처리량을 확인하여 승인 여부를 결정하세요.
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">처리 선택</label>
                <select class="form-control" id="bulk-action">
                    <option value="approve">승인</option>
                    <option value="reject">반려</option>
                    <option value="request-delay">발송 시점 변경 요청</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">사유</label>
                <textarea class="form-control" id="bulk-reason" rows="4" placeholder="처리 사유를 입력하세요"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('bulk-approval-modal')">취소</button>
                <button class="btn btn-primary" onclick="processBulkApproval()">처리</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function reviewBulkSend(id) {
            openModal('bulk-approval-modal');
        }
        
        function processBulkApproval() {
            const action = document.getElementById('bulk-action').value;
            const reason = document.getElementById('bulk-reason').value;
            
            if (!reason) {
                showToast('사유를 입력해주세요.', 'error');
                return;
            }
            
            showToast('처리가 완료되었습니다.', 'success');
            closeModal('bulk-approval-modal');
        }
    </script>
</body>
</html>
