<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발신프로필 관리 - 어드민</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <script src="js/sidebar.js"></script>
            <script>document.write(getSidebarHTML('kakao-profile-list'));</script>
        </aside>
        
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <h2 class="page-title">카카오톡 발신 프로필 목록</h2>
                </div>
                <div class="header-right">
                    <div class="admin-user-info">
                        <div class="user-avatar">관</div>
                        <div>
                            <div class="user-name">관리자</div>
                            <div class="user-role">운영 관리자</div>
                        </div>
                    </div>
                    <button class="btn btn-outline btn-sm">로그아웃</button>
                </div>
            </header>
            
            <div class="admin-content">
                <div class="search-filter-bar">
                    <div class="search-box">
                        <input type="text" class="form-control" id="search-input" placeholder="카카오톡 발신 프로필 ID 또는 채널명 검색" onkeydown="if(event.key==='Enter') searchProfiles()">
                    </div>
                    <div class="filter-group">
                        <div class="filter-item">
                            <select class="form-control" id="status-filter">
                                <option value="">상태 (전체)</option>
                                <option value="활성">활성</option>
                                <option value="검수중">검수중</option>
                                <option value="중단">중단</option>
                                <option value="차단">차단</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <input type="date" class="form-control" id="start-date">
                        </div>
                        <div class="filter-item">
                            <input type="date" class="form-control" id="end-date">
                        </div>
                        <button class="btn btn-primary" onclick="searchProfiles()">검색</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">카카오톡 발신 프로필 목록</h3>
                        <div class="card-description">총 <span id="total-count">3</span>건</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>NO</th>
                                    <th>카카오톡 발신 프로필 ID</th>
                                    <th>카카오톡 채널명</th>
                                    <th>상태</th>
                                    <th>브랜드메시지</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="profile-list-tbody">
                                <!-- 데이터가 동적으로 추가됨 -->
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 발신프로필 상세 모달 -->
    <div class="modal" id="profileDetailModal">
        <div class="modal-content" style="max-width: 1000px;">
            <div class="modal-header">
                <h3 class="modal-title">발신프로필 상세</h3>
                <button class="modal-close" onclick="closeModal('profileDetailModal')">&times;</button>
            </div>
            <div style="max-height: 70vh; overflow-y: auto;">
                <div class="card" style="border: none; padding: 0;">
                    <h4 style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;">기본 정보</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">발신프로필 ID</label>
                            <div class="form-control" style="background-color: #f1f5f9;">@hongchannel</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">카카오톡 채널명</label>
                            <div class="form-control" style="background-color: #f1f5f9;">홍길동 쇼핑몰</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원 정보</label>
                            <div class="form-control" style="background-color: #f1f5f9;">홍길동 (hong@example.com)</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">등록일</label>
                            <div class="form-control" style="background-color: #f1f5f9;">2024-01-15 10:30:00</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">상태</label>
                            <div><span class="badge badge-success">활성</span></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">브랜드메시지 사용여부</label>
                            <div><span class="badge badge-success">Y</span></div>
                        </div>
                    </div>
                </div>
                <div class="card" style="border: none; padding: 0; margin-top: 24px;">
                    <h4 style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;">담당자 정보</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">담당자 휴대폰 번호</label>
                            <div class="form-control" style="background-color: #f1f5f9;">010-****-5678</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">인증 여부</label>
                            <div><span class="badge badge-success">완료</span></div>
                        </div>
                    </div>
                </div>
                <div class="card" style="border: none; padding: 0; margin-top: 24px;">
                    <h4 style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;">카테고리</h4>
                    <div>
                        <span class="badge badge-info">쇼핑몰</span>
                        <span class="badge badge-info">패션</span>
                    </div>
                </div>
                <div class="card" style="border: none; padding: 0; margin-top: 24px;">
                    <h4 style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;">관련 템플릿</h4>
                    <div>
                        <div>등록된 템플릿: <span id="templateCount">15</span>개</div>
                        <button class="btn btn-outline btn-sm" style="margin-top: 8px;" onclick="viewTemplateList()">템플릿 목록 조회</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="handleSyncProfileFromModal()">상태 동기화</button>
                <button class="btn btn-warning" id="profileSuspendBtn" onclick="handleSuspendProfile()">정지</button>
                <button class="btn btn-outline" onclick="closeModal('profileDetailModal')">닫기</button>
            </div>
        </div>
    </div>
    
    <!-- 정지 사유 모달 -->
    <div class="modal" id="profileSuspendModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title">발신프로필 정지</h3>
                <button class="modal-close" onclick="closeModal('profileSuspendModal')">&times;</button>
            </div>
            <div>
                <div class="form-group">
                    <label class="form-label">정지 사유</label>
                    <select class="form-control" id="profileSuspendReason">
                        <option value="">사유 선택</option>
                        <option value="abuse">부정 사용</option>
                        <option value="spam">스팸 발송</option>
                        <option value="violation">정책 위반</option>
                        <option value="complaint">민원 접수</option>
                        <option value="request">회원 요청</option>
                        <option value="other">기타</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">상세 사유</label>
                    <textarea id="profileSuspendDetail" class="form-control" rows="4" placeholder="정지 사유를 상세히 입력하세요"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-warning" onclick="confirmSuspendProfile()">정지 처리</button>
                <button class="btn btn-outline" onclick="closeModal('profileSuspendModal')">취소</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터 (운영정책서 참고: 사업자 회원만 가능, 플러스친구 생성 및 비즈니스 인증 필요)
        const mockProfiles = [
            {
                id: 1,
                profileId: '@조도람',
                channelName: '조도람',
                status: '활성',
                brandMessage: 'Y',
                registerDate: '2025-11-18'
            },
            {
                id: 2,
                profileId: '@테스트',
                channelName: '테스트 채널',
                status: '검수중',
                brandMessage: 'N',
                registerDate: '2025-11-15'
            },
            {
                id: 3,
                profileId: '@마케팅팀',
                channelName: '마케팅팀',
                status: '활성',
                brandMessage: 'Y',
                registerDate: '2025-11-10'
            }
        ];
        
        let currentProfileId = null;
        let currentProfileStatus = null;
        
        // 프로필 목록 로드
        function loadProfiles() {
            const tbody = document.getElementById('profile-list-tbody');
            if (!tbody) return;
            
            tbody.innerHTML = mockProfiles.map((profile, index) => {
                const statusBadge = profile.status === '활성' 
                    ? '<span class="badge badge-success">활성</span>'
                    : '<span class="badge badge-warning">검수중</span>';
                
                const brandMessageCell = profile.brandMessage === 'Y'
                    ? '<span>Y</span>'
                    : `<span style="margin-right: 8px;">N</span><button class="btn btn-info btn-sm" onclick="handleBrandMessageApply('${profile.profileId}')">신청</button>`;
                
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${profile.profileId}</td>
                        <td>${profile.channelName}</td>
                        <td>${statusBadge}</td>
                        <td>${brandMessageCell}</td>
                        <td>${profile.registerDate}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="viewProfileDetail('${profile.profileId}')">상세</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 브랜드메시지 신청 처리
        function handleBrandMessageApply(profileId) {
            confirmAction(`브랜드메시지 신청을 처리하시겠습니까?\n\n프로필 ID: ${profileId}`, function() {
                // API 호출 시뮬레이션
                showToast('브랜드메시지 신청이 완료되었습니다.', 'success');
                
                // 목록 새로고침
                loadProfiles();
            });
        }
        
        // 상세보기
        function viewProfileDetail(profileId) {
            const profile = mockProfiles.find(p => p.profileId === profileId);
            if (!profile) {
                showToast('프로필을 찾을 수 없습니다.', 'error');
                return;
            }
            
            currentProfileId = profileId;
            currentProfileStatus = profile.status;
            
            // 모달 데이터 업데이트
            const modal = document.getElementById('profileDetailModal');
            const formControls = modal.querySelectorAll('.form-control');
            if (formControls.length > 0) {
                formControls[0].textContent = profile.profileId;
            }
            if (formControls.length > 1) {
                formControls[1].textContent = profile.channelName;
            }
            if (formControls.length > 3) {
                formControls[3].textContent = profile.registerDate;
            }
            
            // 상태 배지 업데이트
            const statusBadge = modal.querySelector('.badge-success, .badge-warning, .badge-danger');
            if (statusBadge) {
                if (profile.status === '활성') {
                    statusBadge.textContent = '활성';
                    statusBadge.className = 'badge badge-success';
                } else if (profile.status === '검수중') {
                    statusBadge.textContent = '검수중';
                    statusBadge.className = 'badge badge-warning';
                }
            }
            
            // 브랜드메시지 배지 업데이트
            const brandBadge = modal.querySelectorAll('.badge-success, .badge-secondary');
            if (brandBadge.length > 1) {
                const brandStatusBadge = brandBadge[1];
                if (profile.brandMessage === 'Y') {
                    brandStatusBadge.textContent = 'Y';
                    brandStatusBadge.className = 'badge badge-success';
                } else {
                    brandStatusBadge.textContent = 'N';
                    brandStatusBadge.className = 'badge badge-secondary';
                }
            }
            
            openModal('profileDetailModal');
        }
        
        // 기존 함수명 유지 (하위 호환성)
        function openProfileDetailModal(profileId, status) {
            viewProfileDetail(profileId);
        }
        
        // 테이블에서 동기화 버튼 클릭
        function handleSyncProfile(profileId, buttonElement) {
            currentProfileId = profileId;
            
            confirmAction('카카오톡 채널 상태를 동기화하시겠습니까?', function() {
                // 버튼 비활성화
                buttonElement.disabled = true;
                buttonElement.textContent = '동기화 중...';
                
                // API 호출 시뮬레이션
                setTimeout(function() {
                    // API 호출 완료
                    showToast('상태 동기화가 완료되었습니다.', 'success');
                    
                    // 버튼 복원
                    buttonElement.disabled = false;
                    buttonElement.textContent = '동기화';
                    
                    // 상태 업데이트 (실제로는 API 응답에 따라)
                    const row = buttonElement.closest('tr');
                    const statusCell = row.querySelector('td:nth-child(4)');
                    if (statusCell) {
                        // 동기화 후 상태가 변경될 수 있음
                        // 여기서는 예시로 상태를 업데이트하지 않음
                    }
                }, 1500);
            });
        }
        
        // 상세 모달에서 동기화 버튼 클릭
        function handleSyncProfileFromModal() {
            if (!currentProfileId) {
                const profileIdElement = document.querySelector('#profileDetailModal .form-control');
                currentProfileId = profileIdElement ? profileIdElement.textContent.trim() : '@hongchannel';
            }
            
            confirmAction('카카오톡 채널 상태를 동기화하시겠습니까?', function() {
                // API 호출
                showToast('상태 동기화가 완료되었습니다.', 'success');
                
                // 상태 업데이트 (실제로는 API 응답에 따라)
                const statusBadge = document.querySelector('#profileDetailModal .badge-success, #profileDetailModal .badge-warning, #profileDetailModal .badge-danger');
                if (statusBadge) {
                    // 동기화 후 상태가 변경될 수 있음
                    // 여기서는 예시로 상태를 업데이트하지 않음
                }
            });
        }
        
        // 정지 처리
        function handleSuspendProfile() {
            if (!currentProfileId) {
                const profileIdElement = document.querySelector('#profileDetailModal .form-control');
                currentProfileId = profileIdElement ? profileIdElement.textContent.trim() : '@hongchannel';
            }
            
            // 정지 모달 열기
            document.getElementById('profileSuspendReason').value = '';
            document.getElementById('profileSuspendDetail').value = '';
            openModal('profileSuspendModal');
        }
        
        // 정지 확인 및 처리
        function confirmSuspendProfile() {
            const reason = document.getElementById('profileSuspendReason').value;
            const detail = document.getElementById('profileSuspendDetail').value;
            
            // 유효성 검사
            if (!reason) {
                showToast('정지 사유를 선택해주세요.', 'error');
                return;
            }
            
            if (!detail.trim()) {
                showToast('상세 사유를 입력해주세요.', 'error');
                return;
            }
            
            const reasonText = document.getElementById('profileSuspendReason').selectedOptions[0].text;
            const confirmMessage = `발신프로필을 정지하시겠습니까?\n\n` +
                `발신프로필 ID: ${currentProfileId}\n` +
                `사유: ${reasonText}\n` +
                `상세: ${detail}`;
            
            confirmAction(confirmMessage, function() {
                // API 호출
                
                // 상세 모달의 상태 업데이트
                const statusBadge = document.querySelector('#profileDetailModal .badge-success, #profileDetailModal .badge-warning');
                if (statusBadge) {
                    statusBadge.textContent = '중단';
                    statusBadge.className = 'badge badge-warning';
                }
                
                // 정지 버튼을 해제 버튼으로 변경
                const suspendButton = document.getElementById('profileSuspendBtn');
                if (suspendButton) {
                    suspendButton.textContent = '해제';
                    suspendButton.className = 'btn btn-success';
                    suspendButton.onclick = function() {
                        handleReleaseProfile();
                    };
                }
                
                // 테이블의 상태 업데이트 (모달이 열려있는 경우)
                const rows = document.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const profileIdCell = row.querySelector('td:first-child');
                    if (profileIdCell && profileIdCell.textContent.trim() === currentProfileId) {
                        const statusCell = row.querySelector('td:nth-child(4)');
                        if (statusCell) {
                            statusCell.innerHTML = '<span class="badge badge-warning">중단</span>';
                        }
                        
                        // 정지 버튼을 해제 버튼으로 변경
                        const actionButtons = row.querySelectorAll('td:last-child button');
                        if (actionButtons.length >= 2) {
                            const suspendBtn = actionButtons[1];
                            if (suspendBtn && suspendBtn.textContent.includes('동기화')) {
                                // 동기화 버튼 다음에 정지 버튼이 있다면
                            }
                        }
                    }
                });
                
                // 성공 메시지
                showToast('발신프로필이 정지되었습니다.', 'success');
                
                // 정지 모달 닫기
                closeModal('profileSuspendModal');
            });
        }
        
        // 해제 처리
        function handleReleaseProfile() {
            if (!currentProfileId) {
                const profileIdElement = document.querySelector('#profileDetailModal .form-control');
                currentProfileId = profileIdElement ? profileIdElement.textContent.trim() : '@hongchannel';
            }
            
            confirmAction(`발신프로필을 해제하시겠습니까?\n\n발신프로필 ID: ${currentProfileId}`, function() {
                // API 호출
                
                // 상세 모달의 상태 업데이트
                const statusBadge = document.querySelector('#profileDetailModal .badge-warning, #profileDetailModal .badge-danger');
                if (statusBadge) {
                    statusBadge.textContent = '활성';
                    statusBadge.className = 'badge badge-success';
                }
                
                // 해제 버튼을 정지 버튼으로 변경
                const releaseButton = document.getElementById('profileSuspendBtn');
                if (releaseButton) {
                    releaseButton.textContent = '정지';
                    releaseButton.className = 'btn btn-warning';
                    releaseButton.onclick = function() {
                        handleSuspendProfile();
                    };
                }
                
                // 테이블의 상태 업데이트
                const rows = document.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const profileIdCell = row.querySelector('td:first-child');
                    if (profileIdCell && profileIdCell.textContent.trim() === currentProfileId) {
                        const statusCell = row.querySelector('td:nth-child(4)');
                        if (statusCell) {
                            statusCell.innerHTML = '<span class="badge badge-success">활성</span>';
                        }
                    }
                });
                
                showToast('발신프로필이 해제되었습니다.', 'success');
            });
        }
        
        // 템플릿 목록 조회
        function viewTemplateList() {
            if (!currentProfileId) {
                const profileIdElement = document.querySelector('#profileDetailModal .form-control');
                currentProfileId = profileIdElement ? profileIdElement.textContent.trim() : '@hongchannel';
            }
            
            // 템플릿 목록 페이지로 이동 (필터링된 상태)
            window.open(`template-alimtalk-review.html?profileId=${currentProfileId}`, '_blank');
        }
        
        // 검색 기능
        function searchProfiles() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            let filteredProfiles = mockProfiles.filter(profile => {
                const matchesSearch = !searchTerm || 
                    profile.profileId.toLowerCase().includes(searchTerm) ||
                    profile.channelName.toLowerCase().includes(searchTerm);
                
                const matchesStatus = !statusFilter || profile.status === statusFilter;
                
                const matchesDate = (!startDate || profile.registerDate >= startDate) &&
                                   (!endDate || profile.registerDate <= endDate);
                
                return matchesSearch && matchesStatus && matchesDate;
            });
            
            const tbody = document.getElementById('profile-list-tbody');
            if (!tbody) return;
            
            tbody.innerHTML = filteredProfiles.map((profile, index) => {
                const statusBadge = profile.status === '활성' 
                    ? '<span class="badge badge-success">활성</span>'
                    : '<span class="badge badge-warning">검수중</span>';
                
                const brandMessageCell = profile.brandMessage === 'Y'
                    ? '<span>Y</span>'
                    : `<span style="margin-right: 8px;">N</span><button class="btn btn-info btn-sm" onclick="handleBrandMessageApply('${profile.profileId}')">신청</button>`;
                
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${profile.profileId}</td>
                        <td>${profile.channelName}</td>
                        <td>${statusBadge}</td>
                        <td>${brandMessageCell}</td>
                        <td>${profile.registerDate}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="viewProfileDetail('${profile.profileId}')">상세</button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            // 검색 결과가 없을 때
            if (filteredProfiles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #64748b;">검색 결과가 없습니다.</td></tr>';
            }
        }
        
        // 페이지 로드 시 초기 데이터 표시
        document.addEventListener('DOMContentLoaded', function() {
            loadProfiles();
            createPagination(1, 10, 'pagination');
        });
    </script>
</body>
</html>
