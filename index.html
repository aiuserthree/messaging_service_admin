    <script>
        var WEEKDAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];

        function formatKoreanDate(d) {
            return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
        }

        function formatKoreanDateWithWeekday(d) {
            return formatKoreanDate(d) + '(' + WEEKDAYS_KO[d.getDay()] + ')';
        }

        /** 조회일(ref)이 속한 주의 월요일 ~ 일요일 */
        function getWeekRangeMonSun(ref) {
            var d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
            var day = d.getDay();
            var diffFromMonday = day === 0 ? 6 : day - 1;
            var monday = new Date(d);
            monday.setDate(d.getDate() - diffFromMonday);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { start: monday, end: sunday };
        }

        function getMonthRange(ref) {
            var y = ref.getFullYear();
            var m = ref.getMonth();
            return {
                start: new Date(y, m, 1),
                end: new Date(y, m + 1, 0)
            };
        }

        /** 기간 선택에 따른 날짜 범위 표시 (조회일 기준) */
        function updatePeriodRangeDisplay() {
            var el = document.getElementById('period-range-display');
            if (!el) return;
            var period = document.getElementById('period-select').value;
            var ref = new Date();

            if (period === 'today') {
                el.innerHTML = '<span class="dashboard-period-label">금일</span> ' +
                    '<span class="dashboard-period-value">' + formatKoreanDate(ref) + '</span>';
            } else if (period === 'week') {
                var w = getWeekRangeMonSun(ref);
                el.innerHTML = '<span class="dashboard-period-label">주간</span> ' +
                    '<span class="dashboard-period-value">' +
                    formatKoreanDateWithWeekday(w.start) + ' ~ ' + formatKoreanDateWithWeekday(w.end) +
                    '</span>';
            } else if (period === 'month') {
                var mo = getMonthRange(ref);
                el.innerHTML = '<span class="dashboard-period-label">월간</span> ' +
                    '<span class="dashboard-period-value">' +
                    formatKoreanDate(mo.start) + ' ~ ' + formatKoreanDate(mo.end) +
                    '</span>';
            }
        }

        // KPI 데이터 로드
        function loadKPI() {
            updatePeriodRangeDisplay();
            const period = document.getElementById('period-select').value;
            
            // 실제로는 API 호출
            // 여기서는 예시 데이터
            const mockData = {
                revenue: 12500000,
                sendAmount: 9800000,
                sendCount: 125000,
                successCount: 120000,
                failCount: 5000,
                channels: {
                    sms: 50000,
                    alimtalk: 60000,
                    brandtalk: 10000
                }
            };
            
            // KPI 업데이트
            document.getElementById('kpi-revenue').textContent = '₩' + formatNumber(mockData.revenue);
            document.getElementById('kpi-send-amount').textContent = '₩' + formatNumber(mockData.sendAmount);
            document.getElementById('kpi-send-count').textContent = formatNumber(mockData.sendCount);
            document.getElementById('kpi-success-count').textContent = formatNumber(mockData.successCount);
            document.getElementById('kpi-fail-count').textContent = formatNumber(mockData.failCount);
            
            const successRate = ((mockData.successCount / mockData.sendCount) * 100).toFixed(2);
            const failRate = ((mockData.failCount / mockData.sendCount) * 100).toFixed(2);
            
            document.getElementById('kpi-success-rate').innerHTML = `<span>성공률: ${successRate}%</span>`;
            document.getElementById('kpi-fail-rate').innerHTML = `<span>실패율: ${failRate}%</span>`;
            
            document.getElementById('kpi-channel-detail').innerHTML = 
                `<span>SMS: ${formatNumber(mockData.channels.sms)}, 알림톡: ${formatNumber(mockData.channels.alimtalk)}, 브랜드 메시지: ${formatNumber(mockData.channels.brandtalk)}</span>`;
        }
