<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('notice-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('공지사항'));
            </script>
            
            <div class="admin-content">
                <div style="margin-bottom: 24px;">
                    <button class="btn btn-primary" onclick="location.href='notice-edit.html'">공지사항 등록</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">공지사항 목록</h3>
                        <div class="card-description">시스템 공지사항 목록 조회 및 관리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>중요도</th>
                                    <th>게시 상태</th>
                                    <th>게시 기간</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>시스템 점검 안내</td>
                                    <td><span class="badge badge-danger">긴급</span></td>
                                    <td><span class="badge badge-success">게시중</span></td>
                                    <td>2024-11-19 ~ 2024-11-20</td>
                                    <td>2024-11-19</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="editNotice(1)">수정</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteNotice(1)">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        function editNotice(id) {
            location.href = `notice-edit.html?id=${id}`;
        }
        
        function deleteNotice(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                showToast('삭제되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
