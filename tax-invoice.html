        // 세금계산서 목록 로드
        function loadInvoices(filteredData = null) {
            const data = filteredData || mockInvoices;
            currentInvoiceList = data;
            const tbody = document.getElementById('invoice-list-tbody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #64748b;">세금계산서 자동발행 신청 내역이 없습니다.</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(invoice => {
                var periodY = (invoice.period || '').split('-')[0];
                var periodM = (invoice.period || '').split('-')[1];
                var issueLabel = (periodY && periodM) ? periodY + '년/' + parseInt(periodM, 10) + '월' : '-';
                return `
                <tr>
                    <td>${issueLabel}</td>
                    <td>${invoice.companyName || '-'}</td>
                    <td>${invoice.businessNo}</td>
                    <td class="text-right">₩${invoice.supplyAmount.toLocaleString()}</td>
                    <td class="text-right">₩${invoice.taxAmount.toLocaleString()}</td>
                    <td class="text-right" style="font-weight: 600;">₩${invoice.totalAmount.toLocaleString()}</td>
                    <td>${invoice.requestDate || '-'}</td>
                    <td>
                        <button type="button" class="btn btn-outline btn-sm" onclick="openInvoiceDetail(${invoice.id})">상세보기</button>
                        <button type="button" class="btn btn-primary btn-sm btn-excel-invoice" onclick="downloadInvoiceExcel(${invoice.id})">엑셀 다운로드</button>
                    </td>
                </tr>
            `;
            }).join('');
        }
        
        // 검색
        function searchInvoices() {
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
            const issueMonth = document.getElementById('search-issue-month').value;
            let filtered = mockInvoices;
            if (keyword) {
                filtered = filtered.filter(invoice =>
                    invoice.companyName.toLowerCase().includes(keyword) ||
                    invoice.memberName.toLowerCase().includes(keyword) ||
                    (invoice.businessNo && invoice.businessNo.replace(/-/g, '').includes(keyword.replace(/-/g, '')))
                );
            }
            if (issueMonth) {
                filtered = filtered.filter(invoice => invoice.period === issueMonth);
            }
            loadInvoices(filtered);
            showToast(filtered.length + '건이 조회되었습니다.', 'success');
        }
        
        // 엑셀 전체 다운로드 (현재 조회 목록을 한 파일로)
        function downloadAllInvoicesExcel() {
            if (typeof XLSX === 'undefined') {
                showToast('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.', 'error');
                return;
            }
            var list = currentInvoiceList && currentInvoiceList.length ? currentInvoiceList : mockInvoices;
            if (list.length === 0) {
                showToast('다운로드할 내역이 없습니다.', 'info');
                return;
            }
            var headers = ['발행일시', '회원명', '사업자등록번호', '공급가액', '세액', '합계', '신청일시'];
            var rows = list.map(function(inv) {
                var periodY = (inv.period || '').split('-')[0];
                var periodM = (inv.period || '').split('-')[1];
                var issueLabel = (periodY && periodM) ? periodY + '년/' + parseInt(periodM, 10) + '월' : '-';
                return [
                    issueLabel,
                    inv.companyName || '',
                    inv.businessNo || '',
                    inv.supplyAmount || 0,
                    inv.taxAmount || 0,
                    inv.totalAmount || 0,
                    inv.requestDate || ''
                ];
            });
            var wsData = [headers].concat(rows);
            var ws = XLSX.utils.aoa_to_sheet(wsData);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '세금계산서목록');
            var filename = '세금계산서_자동발행신청_전체_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.xlsx';
            XLSX.writeFile(wb, filename);
            showToast('엑셀 전체 다운로드가 완료되었습니다.', 'success');
        }

        // 해당 업체 데이터로 세금계산서 양식 엑셀 다운로드
        function downloadInvoiceExcel(id) {
            const invoice = mockInvoices.find(function(i) { return i.id === id; });
            if (!invoice) return;
            var safeName = (invoice.companyName || '세금계산서').replace(/[/\\?*:"]/g, '_');
            var fname = '세금계산서_' + safeName + '_' + (invoice.periodEnd || '').replace(/-/g, '') + '.xlsx';
            if (typeof downloadTaxInvoiceXlsxFromInvoice === 'function') {
                downloadTaxInvoiceXlsxFromInvoice(invoice, fname);
            } else {
                showToast('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.', 'error');
            }
        }
        
        // 세금계산서 상세 모달 열기
        function openInvoiceDetail(id) {
            const invoice = mockInvoices.find(i => i.id === id);
            if (!invoice) return;
            
            currentInvoiceId = id;
            currentInvoiceData = invoice;
            
            // 공급받는자 정보
            document.getElementById('modal-company-name').textContent = invoice.companyName;
            document.getElementById('modal-business-no').textContent = invoice.businessNo;
            document.getElementById('modal-ceo-name').textContent = invoice.ceoName;
            document.getElementById('modal-business-type').textContent = invoice.businessType;
            document.getElementById('modal-business-item').textContent = invoice.businessItem;
            document.getElementById('modal-address').textContent = invoice.address;
            document.getElementById('modal-email').textContent = invoice.email;
            
            // 담당자 정보
            document.getElementById('modal-contact-name').textContent = invoice.contactName;
            document.getElementById('modal-contact-phone').textContent = invoice.contactPhone;
            document.getElementById('modal-contact-email').textContent = invoice.contactEmail;
            
            // 기간
            document.getElementById('modal-period').textContent = `${invoice.periodStart} ~ ${invoice.periodEnd}`;
            
            // 거래 내역
            const transactionsHtml = invoice.transactions.map(t => `
                <tr>
                    <td>${t.date}</td>
                    <td>${t.method}</td>
                    <td>${t.item}</td>
                    <td class="text-right">₩${t.supply.toLocaleString()}</td>
                    <td class="text-right">₩${t.tax.toLocaleString()}</td>
                    <td class="text-right">₩${t.total.toLocaleString()}</td>
                </tr>
            `).join('');
            document.getElementById('modal-transactions').innerHTML = transactionsHtml;
            
            // 합계
            document.getElementById('modal-total-supply').textContent = `₩${invoice.supplyAmount.toLocaleString()}`;
            document.getElementById('modal-total-tax').textContent = `₩${invoice.taxAmount.toLocaleString()}`;
            document.getElementById('modal-total-amount').textContent = `₩${invoice.totalAmount.toLocaleString()}`;
            
            openModal('invoice-detail-modal');
        }
    </script>
</body>
</html>
