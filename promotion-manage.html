<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로모션 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
    <style>
        .promo-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0;
        }
        .promo-tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .promo-tab:hover {
            color: #3b82f6;
        }
        .promo-tab.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }
        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }
        .promo-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .promo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .promo-card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .promo-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .promo-card-emoji {
            font-size: 64px;
        }
        .promo-card-content {
            padding: 20px;
        }
        .promo-card-period {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .promo-card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .promo-card-description {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .promo-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }
        .promo-card-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .promo-card-actions {
            display: flex;
            gap: 8px;
        }
        .promo-card-location {
            font-size: 11px;
            color: #94a3b8;
            background-color: #f8fafc;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: #64748b;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state-text {
            font-size: 16px;
        }
        .promo-card.ended {
            opacity: 0.7;
        }
        .promo-card.ended .promo-card-image {
            filter: grayscale(50%);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('promotion-manage'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('프로모션 관리'));
            </script>
            
            <div class="admin-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div class="promo-tabs">
                        <button class="promo-tab active" onclick="switchTab('active')">진행 중 & 예정</button>
                        <button class="promo-tab" onclick="switchTab('ended')">종료된 프로모션</button>
                    </div>
                    <button class="btn btn-primary" onclick="location.href='promotion-edit.html'">프로모션 등록</button>
                </div>
                
                <div id="active-promotions" class="promo-grid">
                    <!-- 진행 중 프로모션 카드들 -->
                </div>
                
                <div id="ended-promotions" class="promo-grid" style="display: none;">
                    <!-- 종료된 프로모션 카드들 -->
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockPromotions = [
            {
                id: 1,
                title: '2024년 12월 상품권이벤트',
                subtitle: '충전만 해도 무조건 상품권 증정',
                description: '충전만 해도 100% 상품권 지급!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'main',
                locationName: '메인 페이지',
                status: 'active',
                emoji: '💰',
                bgColor: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                image: null
            },
            {
                id: 2,
                title: '2024년 12월 신규회원 이벤트',
                subtitle: '톡벨이 처음이라면',
                description: '톡벨이 처음이라면? 문자 2배 적립!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'brand',
                locationName: '브랜드/프론트 페이지',
                status: 'active',
                emoji: '🎁',
                bgColor: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                image: null
            },
            {
                id: 3,
                title: '2024년 12월 기업전환 이벤트',
                subtitle: '기업 전환 시 문자 1천건 무료 지급!',
                description: '기업회원 전환하면 문자 1천건을 드려요!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'popup',
                locationName: '팝업',
                status: 'pending',
                emoji: '🎁',
                bgColor: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                image: null
            },
            {
                id: 4,
                title: '2024년 11월 신규가입 이벤트',
                subtitle: '신규 가입 시 포인트 지급',
                description: '신규 가입하면 1,000P를 드립니다!',
                startDate: '2024-11-01',
                endDate: '2024-11-30',
                location: 'main',
                locationName: '메인 페이지',
                status: 'ended',
                emoji: '🎉',
                bgColor: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                image: null
            }
        ];
        
        // 페이지 로드 시 프로모션 표시
        document.addEventListener('DOMContentLoaded', function() {
            renderPromotions();
        });
        
        // 탭 전환
        function switchTab(tab) {
            document.querySelectorAll('.promo-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'active') {
                document.getElementById('active-promotions').style.display = 'grid';
                document.getElementById('ended-promotions').style.display = 'none';
            } else {
                document.getElementById('active-promotions').style.display = 'none';
                document.getElementById('ended-promotions').style.display = 'grid';
            }
        }
        
        // 프로모션 렌더링
        function renderPromotions() {
            const activeContainer = document.getElementById('active-promotions');
            const endedContainer = document.getElementById('ended-promotions');
            
            const activePromos = mockPromotions.filter(p => p.status === 'active' || p.status === 'pending');
            const endedPromos = mockPromotions.filter(p => p.status === 'ended');
            
            // 진행 중 프로모션
            if (activePromos.length === 0) {
                activeContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">진행 중인 프로모션이 없습니다.</div>
                    </div>
                `;
            } else {
                activeContainer.innerHTML = activePromos.map(promo => createPromoCard(promo)).join('');
            }
            
            // 종료된 프로모션
            if (endedPromos.length === 0) {
                endedContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">종료된 프로모션이 없습니다.</div>
                    </div>
                `;
            } else {
                endedContainer.innerHTML = endedPromos.map(promo => createPromoCard(promo, true)).join('');
            }
        }
        
        // 프로모션 카드 생성
        function createPromoCard(promo, isEnded = false) {
            const statusBadge = {
                'active': '<span class="badge badge-success">진행중</span>',
                'pending': '<span class="badge badge-warning">예정</span>',
                'ended': '<span class="badge badge-secondary">종료</span>'
            }[promo.status];
            
            const imageContent = promo.image 
                ? `<img src="${promo.image}" alt="${promo.title}">`
                : `<div class="promo-card-emoji">${promo.emoji}</div>`;
            
            return `
                <div class="promo-card ${isEnded ? 'ended' : ''}" onclick="viewPromotion(${promo.id})">
                    <div class="promo-card-image" style="background: ${promo.bgColor};">
                        ${imageContent}
                    </div>
                    <div class="promo-card-content">
                        <div class="promo-card-period">${promo.startDate} ~ ${promo.endDate}</div>
                        <div class="promo-card-title">${promo.title}</div>
                        <div class="promo-card-description">${promo.description}</div>
                        <div class="promo-card-footer">
                            <div class="promo-card-status">
                                ${statusBadge}
                                <span class="promo-card-location">${promo.locationName}</span>
                            </div>
                            <div class="promo-card-actions">
                                <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); editPromotion(${promo.id})">수정</button>
                                <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deletePromotion(${promo.id})">삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // 프로모션 상세 보기
        function viewPromotion(id) {
            editPromotion(id);
        }
        
        // 프로모션 수정
        function editPromotion(id) {
            location.href = `promotion-edit.html?id=${id}`;
        }
        
        // 프로모션 삭제
        function deletePromotion(id) {
            const promo = mockPromotions.find(p => p.id === id);
            if (!promo) return;
            
            if (confirm(`"${promo.title}" 프로모션을 삭제하시겠습니까?`)) {
                const index = mockPromotions.findIndex(p => p.id === id);
                if (index !== -1) {
                    mockPromotions.splice(index, 1);
                }
                showToast('삭제되었습니다.', 'success');
                renderPromotions();
            }
        }
    </script>
</body>
</html>
