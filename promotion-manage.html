<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로모션 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('promotion-manage'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('프로모션 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">검색</label>
                            <input type="text" class="form-control" id="search-keyword" placeholder="제목으로 검색">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">상태</label>
                            <select class="form-control" id="filter-status">
                                <option value="">전체</option>
                                <option value="active">사용</option>
                                <option value="inactive">미사용</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchPromotions()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div style="margin: 24px 0;">
                    <button class="btn btn-primary" onclick="location.href='promotion-edit.html'">프로모션 등록</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">프로모션 목록</h3>
                        <div class="card-description">프로모션은 메인, 프론트, 고객센터 이벤트 3곳에 모두 노출됩니다.</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>진행 기간</th>
                                    <th>상태</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="promotion-list-tbody">
                                <!-- 동적으로 생성됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockPromotions = [
            {
                id: 1,
                title: '2024년 12월 상품권이벤트',
                description: '충전만 해도 100% 상품권 지급!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                status: 'active',
                registerDate: '2024-11-25'
            },
            {
                id: 2,
                title: '2024년 12월 신규회원 이벤트',
                description: '톡벨이 처음이라면? 문자 2배 적립!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                status: 'active',
                registerDate: '2024-11-25'
            },
            {
                id: 3,
                title: '2024년 12월 기업전환 이벤트',
                description: '기업회원 전환하면 문자 1천건을 드려요!',
                startDate: '2024-12-15',
                endDate: '2024-12-31',
                status: 'inactive',
                registerDate: '2024-11-20'
            },
            {
                id: 4,
                title: '2024년 11월 신규가입 이벤트',
                description: '신규 가입하면 1,000P를 드립니다!',
                startDate: '2024-11-01',
                endDate: '2024-11-30',
                status: 'inactive',
                registerDate: '2024-10-25'
            }
        ];
        
        // 페이지 로드 시 목록 표시
        document.addEventListener('DOMContentLoaded', function() {
            loadPromotions();
        });
        
        // 프로모션 목록 로드
        function loadPromotions(filteredData = null) {
            const data = filteredData || mockPromotions;
            const tbody = document.getElementById('promotion-list-tbody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #64748b;">등록된 프로모션이 없습니다.</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(promo => {
                const statusBadge = promo.status === 'active'
                    ? '<span class="badge badge-success">사용</span>'
                    : '<span class="badge badge-secondary">미사용</span>';
                return `
                    <tr>
                        <td>
                            <div style="font-weight: 500;">${promo.title}</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">${promo.description}</div>
                        </td>
                        <td>${promo.startDate} ~ ${promo.endDate}</td>
                        <td>${statusBadge}</td>
                        <td>${promo.registerDate}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editPromotion(${promo.id})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePromotion(${promo.id})">삭제</button>
                            ${promo.status === 'active' ? `<button class="btn btn-outline btn-sm" onclick="endPromotion(${promo.id})">미사용</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 검색
        function searchPromotions() {
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
            const status = document.getElementById('filter-status').value;
            
            let filtered = mockPromotions.filter(promo => {
                if (keyword && !promo.title.toLowerCase().includes(keyword)) return false;
                if (status && promo.status !== status) return false;
                return true;
            });
            
            loadPromotions(filtered);
            showToast(`${filtered.length}건이 조회되었습니다.`, 'success');
        }
        
        // 프로모션 수정
        function editPromotion(id) {
            location.href = `promotion-edit.html?id=${id}`;
        }
        
        // 프로모션 삭제
        function deletePromotion(id) {
            const promo = mockPromotions.find(p => p.id === id);
            if (!promo) return;
            
            if (confirm(`"${promo.title}" 프로모션을 삭제하시겠습니까?`)) {
                const index = mockPromotions.findIndex(p => p.id === id);
                if (index !== -1) {
                    mockPromotions.splice(index, 1);
                }
                showToast('삭제되었습니다.', 'success');
                loadPromotions();
            }
        }
        
        // 프로모션 미사용 처리
        function endPromotion(id) {
            const promo = mockPromotions.find(p => p.id === id);
            if (!promo) return;
            
            if (confirm(`"${promo.title}" 프로모션을 미사용으로 변경하시겠습니까?`)) {
                promo.status = 'inactive';
                showToast('미사용으로 변경되었습니다.', 'success');
                loadPromotions();
            }
        }
    </script>
</body>
</html>
