<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로모션 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('promotion-manage'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('프로모션 관리'));
            </script>
            
            <div class="admin-content">
                <div style="margin-bottom: 24px;">
                    <button class="btn btn-primary" onclick="openPromotionModal()">프로모션 등록</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">프로모션 목록</h3>
                        <div class="card-description">프로모션 등록 및 운영 관리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>진행 기간</th>
                                    <th>노출 위치</th>
                                    <th>상태</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>신규 가입 이벤트</td>
                                    <td>2024-11-01 ~ 2024-11-30</td>
                                    <td>브랜드/프론트 페이지</td>
                                    <td><span class="badge badge-success">진행중</span></td>
                                    <td>2024-11-01</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="editPromotion(1)">수정</button>
                                        <button class="btn btn-danger btn-sm" onclick="deletePromotion(1)">삭제</button>
                                        <button class="btn btn-outline btn-sm" onclick="endPromotion(1)">종료</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 프로모션 등록/수정 모달 -->
    <div id="promotion-modal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 class="modal-title" id="promotion-modal-title">프로모션 등록</h3>
                <button class="modal-close" onclick="closeModal('promotion-modal')">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div class="form-group">
                    <label class="form-label">프로모션 제목 <span style="color: #ef4444;">*</span></label>
                    <input type="text" class="form-control" id="promotion-title" placeholder="프로모션 제목을 입력하세요">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">시작일 <span style="color: #ef4444;">*</span></label>
                        <input type="date" class="form-control" id="promotion-start-date">
                    </div>
                    <div class="form-group">
                        <label class="form-label">종료일 <span style="color: #ef4444;">*</span></label>
                        <input type="date" class="form-control" id="promotion-end-date">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">노출 위치 <span style="color: #ef4444;">*</span></label>
                    <select class="form-control" id="promotion-location">
                        <option value="">선택하세요</option>
                        <option value="main">메인 페이지</option>
                        <option value="brand">브랜드/프론트 페이지</option>
                        <option value="popup">팝업</option>
                        <option value="banner">배너</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">프로모션 내용 <span style="color: #ef4444;">*</span></label>
                    <textarea class="form-control" id="promotion-content" rows="6" placeholder="프로모션 내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">이미지 업로드</label>
                    <input type="file" class="form-control" id="promotion-image" accept="image/*">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('promotion-modal')">취소</button>
                <button class="btn btn-primary" id="promotion-submit-btn" onclick="savePromotion()">등록</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        let currentPromotionId = null;
        
        function openPromotionModal(id = null) {
            currentPromotionId = id;
            
            if (id) {
                document.getElementById('promotion-modal-title').textContent = '프로모션 수정';
                document.getElementById('promotion-submit-btn').textContent = '수정';
                // Mock 데이터 로드
                document.getElementById('promotion-title').value = '신규 가입 이벤트';
                document.getElementById('promotion-start-date').value = '2024-11-01';
                document.getElementById('promotion-end-date').value = '2024-11-30';
                document.getElementById('promotion-location').value = 'brand';
                document.getElementById('promotion-content').value = '신규 가입 시 무료 포인트 1,000P를 지급합니다!\n\n- 대상: 신규 가입 회원\n- 기간: 2024년 11월 한 달간\n- 혜택: 1,000P 즉시 지급';
            } else {
                document.getElementById('promotion-modal-title').textContent = '프로모션 등록';
                document.getElementById('promotion-submit-btn').textContent = '등록';
                document.getElementById('promotion-title').value = '';
                document.getElementById('promotion-start-date').value = '';
                document.getElementById('promotion-end-date').value = '';
                document.getElementById('promotion-location').value = '';
                document.getElementById('promotion-content').value = '';
            }
            
            openModal('promotion-modal');
        }
        
        function editPromotion(id) {
            openPromotionModal(id);
        }
        
        function savePromotion() {
            const title = document.getElementById('promotion-title').value.trim();
            const startDate = document.getElementById('promotion-start-date').value;
            const endDate = document.getElementById('promotion-end-date').value;
            const location = document.getElementById('promotion-location').value;
            const content = document.getElementById('promotion-content').value.trim();
            
            if (!title) {
                showToast('제목을 입력해주세요.', 'error');
                return;
            }
            if (!startDate || !endDate) {
                showToast('진행 기간을 설정해주세요.', 'error');
                return;
            }
            if (!location) {
                showToast('노출 위치를 선택해주세요.', 'error');
                return;
            }
            if (!content) {
                showToast('내용을 입력해주세요.', 'error');
                return;
            }
            
            if (currentPromotionId) {
                showToast('프로모션이 수정되었습니다.', 'success');
            } else {
                showToast('프로모션이 등록되었습니다.', 'success');
            }
            closeModal('promotion-modal');
        }
        
        function deletePromotion(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                showToast('삭제되었습니다.', 'success');
            }
        }
        
        function endPromotion(id) {
            if (confirm('프로모션을 종료하시겠습니까?')) {
                showToast('프로모션이 종료되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
