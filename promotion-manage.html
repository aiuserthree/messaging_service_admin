<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로모션 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('promotion-manage'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('프로모션 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="filter-item">
                            <label class="form-label">노출 위치</label>
                            <select class="form-control" id="filter-location">
                                <option value="">전체</option>
                                <option value="main">메인 (로그인 후)</option>
                                <option value="front">프론트 (비로그인)</option>
                                <option value="event">고객센터 이벤트</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">상태</label>
                            <select class="form-control" id="filter-status">
                                <option value="">전체</option>
                                <option value="active">진행중</option>
                                <option value="pending">예정</option>
                                <option value="ended">종료</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchPromotions()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div style="margin: 24px 0;">
                    <button class="btn btn-primary" onclick="location.href='promotion-edit.html'">프로모션 등록</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">프로모션 목록</h3>
                        <div class="card-description">프로모션 등록 및 운영 관리</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 80px;">미리보기</th>
                                    <th>제목</th>
                                    <th>진행 기간</th>
                                    <th>노출 위치</th>
                                    <th>상태</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="promotion-list-tbody">
                                <!-- 동적으로 생성됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockPromotions = [
            {
                id: 1,
                title: '2024년 12월 상품권이벤트',
                description: '충전만 해도 100% 상품권 지급!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'main',
                locationName: '메인 (로그인 후)',
                status: 'active',
                registerDate: '2024-11-25',
                imageUrl: null,
                emoji: '💰'
            },
            {
                id: 2,
                title: '2024년 12월 신규회원 이벤트',
                description: '톡벨이 처음이라면? 문자 2배 적립!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'front',
                locationName: '프론트 (비로그인)',
                status: 'active',
                registerDate: '2024-11-25',
                imageUrl: null,
                emoji: '🎁'
            },
            {
                id: 3,
                title: '2024년 12월 기업전환 이벤트',
                description: '기업회원 전환하면 문자 1천건을 드려요!',
                startDate: '2024-12-01',
                endDate: '2024-12-31',
                location: 'event',
                locationName: '고객센터 이벤트',
                status: 'active',
                registerDate: '2024-11-20',
                imageUrl: null,
                emoji: '🎁'
            },
            {
                id: 4,
                title: '2024년 11월 신규가입 이벤트',
                description: '신규 가입하면 1,000P를 드립니다!',
                startDate: '2024-11-01',
                endDate: '2024-11-30',
                location: 'main',
                locationName: '메인 (로그인 후)',
                status: 'ended',
                registerDate: '2024-10-25',
                imageUrl: null,
                emoji: '🎉'
            }
        ];
        
        // 페이지 로드 시 목록 표시
        document.addEventListener('DOMContentLoaded', function() {
            loadPromotions();
        });
        
        // 프로모션 목록 로드
        function loadPromotions(filteredData = null) {
            const data = filteredData || mockPromotions;
            const tbody = document.getElementById('promotion-list-tbody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #64748b;">등록된 프로모션이 없습니다.</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(promo => {
                const statusBadge = {
                    'active': '<span class="badge badge-success">진행중</span>',
                    'pending': '<span class="badge badge-warning">예정</span>',
                    'ended': '<span class="badge badge-secondary">종료</span>'
                }[promo.status];
                
                const locationBadge = {
                    'main': '<span class="badge badge-info">메인</span>',
                    'front': '<span class="badge badge-primary">프론트</span>',
                    'event': '<span class="badge badge-secondary">이벤트</span>'
                }[promo.location];
                
                const thumbnail = promo.imageUrl 
                    ? `<img src="${promo.imageUrl}" style="width: 60px; height: 40px; object-fit: cover; border-radius: 4px;">`
                    : `<div style="width: 60px; height: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px;">${promo.emoji}</div>`;
                
                return `
                    <tr>
                        <td>${thumbnail}</td>
                        <td>
                            <div style="font-weight: 500;">${promo.title}</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">${promo.description}</div>
                        </td>
                        <td>${promo.startDate} ~ ${promo.endDate}</td>
                        <td>${locationBadge}</td>
                        <td>${statusBadge}</td>
                        <td>${promo.registerDate}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editPromotion(${promo.id})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePromotion(${promo.id})">삭제</button>
                            ${promo.status === 'active' ? `<button class="btn btn-outline btn-sm" onclick="endPromotion(${promo.id})">종료</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 검색
        function searchPromotions() {
            const location = document.getElementById('filter-location').value;
            const status = document.getElementById('filter-status').value;
            
            let filtered = mockPromotions.filter(promo => {
                if (location && promo.location !== location) return false;
                if (status && promo.status !== status) return false;
                return true;
            });
            
            loadPromotions(filtered);
            showToast(`${filtered.length}건이 조회되었습니다.`, 'success');
        }
        
        // 프로모션 수정
        function editPromotion(id) {
            location.href = `promotion-edit.html?id=${id}`;
        }
        
        // 프로모션 삭제
        function deletePromotion(id) {
            const promo = mockPromotions.find(p => p.id === id);
            if (!promo) return;
            
            if (confirm(`"${promo.title}" 프로모션을 삭제하시겠습니까?`)) {
                const index = mockPromotions.findIndex(p => p.id === id);
                if (index !== -1) {
                    mockPromotions.splice(index, 1);
                }
                showToast('삭제되었습니다.', 'success');
                loadPromotions();
            }
        }
        
        // 프로모션 종료
        function endPromotion(id) {
            const promo = mockPromotions.find(p => p.id === id);
            if (!promo) return;
            
            if (confirm(`"${promo.title}" 프로모션을 종료하시겠습니까?`)) {
                promo.status = 'ended';
                showToast('프로모션이 종료되었습니다.', 'success');
                loadPromotions();
            }
        }
    </script>
</body>
</html>
