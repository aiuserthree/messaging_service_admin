<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - 관리자 시스템</title>
    <link rel="stylesheet" href="css/admin-common.css">
</head>
<body>
    <div class="admin-container">
        <script src="js/sidebar.js"></script>
        <script>
            document.write(getSidebarHTML('inquiry-list'));
        </script>
        
        <main class="admin-main">
            <script>
                document.write(getHeaderHTML('문의 관리'));
            </script>
            
            <div class="admin-content">
                <div class="card">
                    <div class="search-filter-bar">
                        <div class="search-box">
                            <label class="form-label">회원명 검색</label>
                            <input type="text" class="form-control" placeholder="회원명으로 검색" id="search-member">
                        </div>
                        <div class="filter-item">
                            <label class="form-label">문의 유형</label>
                            <select class="form-control" id="filter-type">
                                <option value="">전체</option>
                                <option value="technical">기술 문의</option>
                                <option value="billing">결제 문의</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="form-label">처리 상태</label>
                            <select class="form-control" id="filter-status">
                                <option value="">전체</option>
                                <option value="pending">처리 대기</option>
                                <option value="processing">처리 중</option>
                                <option value="completed">완료</option>
                            </select>
                        </div>
                        <div class="filter-item" style="align-self: flex-end;">
                            <button class="btn btn-primary" onclick="searchInquiries()">조회</button>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">문의 목록</h3>
                        <div class="card-description">회원의 1:1 문의 및 고객센터 문의 목록</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>접수일</th>
                                    <th>회원명</th>
                                    <th>제목</th>
                                    <th>유형</th>
                                    <th>처리 상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="inquiry-list-tbody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: 40px;">
                                        조회 버튼을 클릭하여 문의 목록을 검색하세요.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 문의 답변 모달 -->
    <div id="inquiry-detail-modal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 class="modal-title">문의 답변</h3>
                <button class="modal-close" onclick="closeModal('inquiry-detail-modal')">&times;</button>
            </div>
            <div style="padding: 24px;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">문의 내용</h3>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">접수일</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-inquiry-date">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">회원명</label>
                            <div class="form-control" style="background-color: #f1f5f9;" id="modal-inquiry-member">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">유형</label>
                            <div id="modal-inquiry-type">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">처리 상태</label>
                            <div id="modal-inquiry-status">-</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">제목</label>
                        <div class="form-control" style="background-color: #f1f5f9;" id="modal-inquiry-title">-</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">문의 내용</label>
                        <div class="form-control" style="background-color: #f1f5f9; min-height: 100px; padding: 16px; white-space: pre-wrap;" id="modal-inquiry-content">-</div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">답변 작성</h3>
                    </div>
                    <div class="form-group">
                        <label class="form-label">답변 내용</label>
                        <textarea class="form-control" id="answer-content" rows="6" placeholder="답변 내용을 입력하세요"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('inquiry-detail-modal')">취소</button>
                <button class="btn btn-primary" onclick="submitAnswer()">답변 등록</button>
            </div>
        </div>
    </div>
    
    <script src="js/admin-common.js"></script>
    <script>
        // Mock 데이터
        const mockInquiries = [
            {
                id: 1,
                date: '2024-11-19',
                memberName: '홍길동',
                memberEmail: 'hong@example.com',
                title: '결제 관련 문의',
                content: '결제가 정상적으로 처리되지 않았습니다. 카드 결제를 시도했는데 실패했습니다. 환불이 필요한지 확인 부탁드립니다.',
                type: 'billing',
                typeLabel: '결제 문의',
                status: 'pending',
                statusLabel: '처리 대기'
            },
            {
                id: 2,
                date: '2024-11-18',
                memberName: '김철수',
                memberEmail: 'kim@example.com',
                title: 'API 연동 문의',
                content: 'API 연동 시 인증 토큰 발급 방법에 대해 문의드립니다. 문서를 확인했지만 이해가 안 되는 부분이 있어서요.',
                type: 'technical',
                typeLabel: '기술 문의',
                status: 'processing',
                statusLabel: '처리 중'
            },
            {
                id: 3,
                date: '2024-11-17',
                memberName: '이영희',
                memberEmail: 'lee@example.com',
                title: '템플릿 승인 기간',
                content: '템플릿 승인까지 얼마나 걸리나요? 급하게 사용해야 하는 템플릿인데요.',
                type: 'other',
                typeLabel: '기타',
                status: 'completed',
                statusLabel: '완료'
            },
            {
                id: 4,
                date: '2024-11-16',
                memberName: '박지훈',
                memberEmail: 'park@example.com',
                title: '발신번호 인증 문의',
                content: '발신번호 인증이 계속 거부되는데 이유를 알 수 있을까요?',
                type: 'technical',
                typeLabel: '기술 문의',
                status: 'pending',
                statusLabel: '처리 대기'
            },
            {
                id: 5,
                date: '2024-11-15',
                memberName: '최민수',
                memberEmail: 'choi@example.com',
                title: '요금제 변경 문의',
                content: '현재 사용 중인 요금제에서 다른 요금제로 변경하고 싶습니다.',
                type: 'billing',
                typeLabel: '결제 문의',
                status: 'completed',
                statusLabel: '완료'
            }
        ];
        
        let currentInquiryId = null;
        
        function searchInquiries() {
            const searchMember = document.getElementById('search-member').value.trim();
            const filterType = document.getElementById('filter-type').value;
            const filterStatus = document.getElementById('filter-status').value;
            
            // 필터링
            let filteredInquiries = mockInquiries.filter(inquiry => {
                // 회원명 검색
                if (searchMember && !inquiry.memberName.includes(searchMember)) {
                    return false;
                }
                // 문의 유형 필터
                if (filterType && inquiry.type !== filterType) {
                    return false;
                }
                // 처리 상태 필터
                if (filterStatus && inquiry.status !== filterStatus) {
                    return false;
                }
                return true;
            });
            
            // 테이블 업데이트
            const tbody = document.getElementById('inquiry-list-tbody');
            
            if (filteredInquiries.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            검색 결과가 없습니다.
                        </td>
                    </tr>
                `;
                showToast('검색 결과가 없습니다.', 'info');
            } else {
                tbody.innerHTML = filteredInquiries.map(inquiry => {
                    const statusBadge = {
                        'pending': 'badge-warning',
                        'processing': 'badge-info',
                        'completed': 'badge-success'
                    }[inquiry.status] || 'badge-secondary';
                    
                    return `
                        <tr>
                            <td>${inquiry.date}</td>
                            <td>${inquiry.memberName}</td>
                            <td>${inquiry.title}</td>
                            <td>${inquiry.typeLabel}</td>
                            <td><span class="badge ${statusBadge}">${inquiry.statusLabel}</span></td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="viewDetail(${inquiry.id})">답변</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                showToast(`${filteredInquiries.length}건의 문의가 조회되었습니다.`, 'success');
            }
        }
        
        function viewDetail(id) {
            currentInquiryId = id;
            const inquiry = mockInquiries.find(i => i.id === id);
            
            if (inquiry) {
                document.getElementById('modal-inquiry-date').textContent = inquiry.date;
                document.getElementById('modal-inquiry-member').textContent = `${inquiry.memberName} (${inquiry.memberEmail})`;
                document.getElementById('modal-inquiry-title').textContent = inquiry.title;
                document.getElementById('modal-inquiry-content').textContent = inquiry.content;
                
                const typeBadge = {
                    'technical': 'badge-info',
                    'billing': 'badge-warning',
                    'other': 'badge-secondary'
                }[inquiry.type] || 'badge-secondary';
                document.getElementById('modal-inquiry-type').innerHTML = `<span class="badge ${typeBadge}">${inquiry.typeLabel}</span>`;
                
                const statusBadge = {
                    'pending': 'badge-warning',
                    'processing': 'badge-info',
                    'completed': 'badge-success'
                }[inquiry.status] || 'badge-secondary';
                document.getElementById('modal-inquiry-status').innerHTML = `<span class="badge ${statusBadge}">${inquiry.statusLabel}</span>`;
                
                // 답변 내용 초기화
                document.getElementById('answer-content').value = '';
                
                // 완료된 문의는 답변 입력 비활성화
                const answerTextarea = document.getElementById('answer-content');
                const submitButton = document.querySelector('#inquiry-detail-modal .btn-primary');
                
                if (inquiry.status === 'completed') {
                    answerTextarea.disabled = true;
                    answerTextarea.placeholder = '이미 답변이 완료된 문의입니다.';
                    submitButton.disabled = true;
                    submitButton.textContent = '답변 완료';
                } else {
                    answerTextarea.disabled = false;
                    answerTextarea.placeholder = '답변 내용을 입력하세요';
                    submitButton.disabled = false;
                    submitButton.textContent = '답변 등록';
                }
                
                openModal('inquiry-detail-modal');
            }
        }
        
        function submitAnswer() {
            if (!currentInquiryId) {
                showToast('문의 정보를 찾을 수 없습니다.', 'error');
                return;
            }
            
            const content = document.getElementById('answer-content').value.trim();
            if (!content) {
                showToast('답변 내용을 입력해주세요.', 'error');
                return;
            }
            
            // Mock 데이터 업데이트
            const inquiry = mockInquiries.find(i => i.id === currentInquiryId);
            if (inquiry) {
                inquiry.status = 'completed';
                inquiry.statusLabel = '완료';
            }
            
            // 성공 메시지
            showToast('답변이 등록되었습니다. 회원에게 알림이 발송되었습니다.', 'success');
            
            // 모달 닫기
            closeModal('inquiry-detail-modal');
            
            // 목록 새로고침
            searchInquiries();
        }
        
        // Enter 키로 검색
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-member');
            if (searchInput) {
                searchInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        searchInquiries();
                    }
                });
            }
            
            // 페이지 로드 시 초기 데이터 표시
            searchInquiries();
        });
</body>
</html>
